flavor_tur.1113.t:"The Ilios League"
flavor_tur.1113.desc:"The Ilios League emerged in 6443 as a confederation uniting semi-independent city-states once part of the fallen Ilios Empire. Bound by shared heritage and a vision for collective prosperity, these resilient city-states banded together to forge a new era of cooperation and mutual defense. With each member contributing their unique strengths and resources, the Ilios League stands as a testament to the resilience of its people and the enduring spirit of unity amidst the echoes of a glorious past."
flavor_tur.1113.a:"Splendid"
mu1_vril.1.t:0 "The §PVril§! Awakening"
 mu1_vril.1.d:0 "§YDeep beneath the Grand Laboratory§!, where the clone vats hum, §Rsomething older stirs§!. The engineers report a current that flows without wire, a force that answers will before command. It seeps from Agartha's sealed vaults and pulses in the core of the Great Antenna. The scholars name it §PVril§!: the force the Annunaki once bent to raise their cities and pierce space itself. Handled carelessly, it turns flesh to glass. Mastered, §Rmatter itself kneels§!. Yakub's hand hovers over the first capacitor: §Yharness it now§!, or §Tstudy it longer§!?"

 mu1_vril.1.a:0 "Harness the Current"
 mu1_vril.1.b:0 "Study before touching"

 mu1_vril_awakening_mod:0 "§PVril§! Awakening"
 desc_mu1_vril_awakening_mod:0 "The current flows freely; innovation surges, but the people feel it in their teeth and fear what hums beneath the throne."

 mu1_vril_cautious_study_mod:0 "Cautious §PVril§! Study"
 desc_mu1_vril_cautious_study_mod:0 "We map the current before we dive; mastery grows slowly, safely."
  mu1_lunar_reclamation_title:0 "The Lunar Reclamation"
 mu1_lunar_reclamation_desc:0 "§RThe Annunaki left more than portals.§! High above, §Ybeyond the veil of atmosphere§!, §Gthe Moon remembers§!.\n\nAfter the Conjunction, §Tthe scopes reveal structures§! upon the lunar surface—§Bnot craters, but foundations§!; §Rnot mountains, but towers§! collapsed into silver dust. §YThe Annunaki's orbital citadel§!, abandoned §Gwhen they lost control§! of the gates.\n\n§TNow, we reclaim it.§! §BVril-powered vessels§! will pierce the sky, §Rcarrying Genesis-breed engineers§! and §Ycopper-bound blueprints§!. We will §Gwake the moon's machinery§!, §Trestore the lunar arrays§!, and §Bfrom that silver throne§!, §RYakub will count not just the world—but the stars§!."

 mu1_lunar.1.t:0 "Ruins on the Moon"
 mu1_lunar.1.d:0 "§GThe Great Antenna receives§! faint §Ypulses from above§!. When we §Taim the scopes§! at the Moon's dark side, §Rgeometry screams back§!: §Bperfect angles§!, §Ycrystalline pylons§!, §Ghalls carved from basalt§! that §Tnever formed naturally§!.\n\n§RThe Annunaki were here.§! Their §Borbital observatory§!, their §Ylaunch nexus§!, their §Gcommand citadel§!—all §Tstill standing§!, waiting in the airless dark.\n\n§YWe must go up.§!"

 mu1_lunar.1.a:0 "Send §PVril§!-powered vessels"

 mu1_lunar.2.t:0 "Landing on the Silver Shore"
 mu1_lunar.2.d:0 "§GThe first craft lands.§! §YGenesis-breed astronauts§! step onto §Tlunar dust§! that has not been disturbed in §Rmillennia§!. They §Benter the ruins§!: halls §Glit by §PVril§! conduits§! still §Yhumming faintly§!, §Rthrones sized for beings taller than us§!, §Tcontrol panels§! etched with §Bglyphs we half-recognize§! from Agartha's vaults.\n\n§YThe systems are dormant—but intact.§! §GWith enough power, they could wake.§!"

 mu1_lunar.2.a:0 "Activate the ancient systems"

 mu1_lunar.3.t:0 "The Reconstruction Begins"
 mu1_lunar.3.d:0 "§TVril surges§! through §Bsilver conduits§! older than empires. §GThe lunar base stirs§!: §Rlights flicker§!, §Yair processors cough§!, §Tdoors unseal§! with hisses that echo §Gacross airless plains§!.\n\nBut §Rdecay runs deep§!. Whole §Bsections collapsed§!; §Yreactors cracked§!; §Tnavigation arrays warped§! by micro-meteor storms. §GTo restore it fully§! will cost §Revery resource we have§!.\n\n§YDo we finish what the Annunaki left—or retreat?§!"

 mu1_lunar.3.a:0 "Complete the reconstruction"
 mu1_lunar.3.b:0 "Abandon the project"

 mu1_lunar.4.t:0 "The Lunar Throne"
 mu1_lunar.4.d:0 "§GIt is done.§!\n\n§TThe Lunar Base§! breathes again. §BVril reactors hum§! at §Yfull capacity§!; §Rair recyclers§! fill the halls with §Gpressure and oxygen§!; §Yobservation arrays§! §Bsweep across Earth§! below, §Tcounting every city§!, §Revery fleet§!, §Gevery whisper of rebellion§!.\n\n§RYakub ascends.§! He sits in §Tthe Command Throne§!—§Bnot on Earth, but above it§!, §Yin the silver citadel§! where §Gthe Annunaki once ruled§!. From here, §Rhe sees all§!: §Tthe curvature of the world§!, §Bthe curl of trade winds§!, §Ythe glow of §PVril§! nexuses§! pulsing across three continents.\n\n§GThe Engineer-King has left the ground.§! §RHe counts from orbit now§!, and §Tthe ledger spans planets§!."

 mu1_lunar.4.a:0 "Yakub ascends to the stars"

 mu1_lunar.5.t:0 "The Moon Awakens"
 mu1_lunar.5.d:0 "§YEvery nation sees it.§!\n\nThe §TMoon shines brighter§! tonight—not by reflection, but by §Ginternal light§!. §BStructures§! are §Rvisible on its surface§!, §Yglowing with blue fire§!. §TAstronomers panic§!; §Gpriests declare omens§!; §Rrulers tremble§!.\n\n§BMu has conquered the sky itself.§!"

 mu1_lunar.5.a:0 "This changes everything"

 mu1_lunar_project_mod:0 "Lunar Reconstruction Project"
 desc_mu1_lunar_project_mod:0 "All resources pour skyward; corruption seeps in; unrest grows beneath the ambition."

 mu1_lunar_expedition_mod:0 "Lunar Expedition"
 desc_mu1_lunar_expedition_mod:0 "We learn to pierce the heavens; innovation soars—at terrible cost."

 mu1_lunar_dominion_mod:0 "Lunar Dominion"
 desc_mu1_lunar_dominion_mod:0 "We rule from orbit. The throne is silver. The ledger spans worlds."

 mu1_lunar_awe_mod:0 "Awe of the Lunar Empire"
 desc_mu1_lunar_awe_mod:0 "They rule the Moon; diplomacy feels pointless; spies despair; the people whisper in fear."
 l_english:
 mu1_beyond_the_veil_title:0 "§RBeyond the Veil§!"
 mu1_beyond_the_veil_desc:0 "§RThe Golden Age is complete.§! §TThe world is counted.§! §GThe Moon obeys.§! §BHumanity is perfected.§!\n\n§YBut there is one boundary left.§!\n\n§TThe Veil§!—the §Rfinal membrane§! between §Gknown and unknowable§!, the §Bedge where mathematics dissolves§! into §Ysomething older than logic§!. The §RConjunction opened cracks§!; §Gthe Annunaki fled through them§!; §Tbut no one has ever returned§! to describe §Bwhat lies beyond§!.\n\n§RYakub, who has counted all§!, now §Ywishes to count the uncountable§!. §GTo build vessels of pure Vril§!, §Tto pierce the Veil§!, and §Bto sail into the space between thoughts§!.\n\n§YThis is the final equation.§! §RBeyond this, there are no more missions—only the infinite.§!"

 mu1_veil_warning_tooltip:0 "§RWARNING: This mission is irreversible. Success means transcendence. Failure means collapse.§!"

 mu1_veil.1.t:0 "The §PVril§! Fleet"
 mu1_veil.1.d:0 "§GIn the lunar shipyards§!, §Bengineers craft vessels§! that §Rdefy description§!. Not metal, but §Ycrystallized Vril§!—§Tships that breathe§!, §Bhulls that think§!, §Gengines powered by the current between worlds§!.\n\n§RThey are not built; they are grown§!, §Yshaped from possibility§!, §Tcalibrated to frequencies§! that §Bno human ear can hear§!. §GThey will carry no crew§!—only §Rcalculation§!, §Ypure intention§!, and §Ta final question§!: §BWhat lies beyond?§!"

 mu1_veil.1.a:0 "Construct the vessels"
 mu1_veil.1.b:0 "Abort the project"

 mu1_veil.2.t:0 "Opening the Veil"
 mu1_veil.2.d:0 "§RThe Great Antenna screams.§!\n\n§GEvery §PVril§! conduit§! on Earth §Boverloads at once§!, §Ypouring current into a single point§! above §Tthe Lunar Base§!. §RSpace tears.§! §GNot a portal—a wound§!, a §Bpuncture in the membrane§! of §Treality itself§!.\n\n§YBeyond it: not darkness, but color that has no name.§! §GNot void, but structure too complex for eyes.§! §RGeometry that counts itself.§!\n\n§TThe Veil opens.§! §BThree provinces burn from the feedback.§!"

 mu1_veil.2.a:0 "Open the Veil"

 mu1_veil.3.t:0 "Departure"
 mu1_veil.3.d:0 "§GThe §PVril§! Fleet launches.§!\n\n§YTen vessels§!, §Bglowing copper-blue§!, §Trise from the Moon§! and §Ralign with the wound§!. They §Gdo not accelerate—they unfold§!, §Bslipping sideways§! into §Tdimensions that have no maps§!.\n\n§RYakub watches from the Command Throne.§! §GThe abacus clicks§!—§Yonce, twice§!, §Tthree times§!—and then §Bfalls silent§!.\n\n§YThe fleet is gone.§! §TNow, we wait.§!"

 mu1_veil.3.a:0 "They depart"

 mu1_veil.4.t:0 "Return from the Veil"
 mu1_veil.4.d:0 "§RFive years pass.§!\n\n§GThe wound above the Moon§! has §Ynever closed§!. It §Bpulses§!, §Tbreathing§! with §Ra rhythm that drives astronomers mad§!. And then—§Ysomething returns§!.\n\n§GNot the fleet.§! §BSomething else.§! §TA signal§!, §Ycarved in frequencies§! that §Rteach the receivers to understand them§! as they arrive:\n\n§T\"We have crossed. We have seen. The Veil is not barrier—it is filter. Beyond: the Architects. Beyond: the First Equation. Beyond: Yakub's origin.\n\nWe return changed. Will you accept what we have become?\"§!"

 mu1_veil.4.a:0 "We transcend"
 mu1_veil.4.b:0 "We collapse"

 mu1_veil.5.t:0 "Beyond Comprehension"
 mu1_veil.5.d:0 "§RThe sky changes.§!\n\n§GEvery nation§! sees it: §Tthe Moon glows wrong§!, §Bthe stars rearrange§!, §Ygeometry bends§! in §Rways that should not be possible§!. §GMu has crossed a threshold§! that §Bno empire should cross§!.\n\n§TThey are no longer mortal.§! §RWe do not know what they are becoming.§!"

 mu1_veil.5.a:0 "This is beyond us"

 mu1_veil.6.t:0 "What Lies Beyond"
 mu1_veil.6.d:0 "§YYakub sits in silence.§!\n\n§GThe fleet has merged§! with §Bhim§!, with §Tthe empire§!, with §Revery counted soul§!. §YThey brought back not cargo, but knowledge§!—§Gknowledge that rewrites§! the §Bfundamental constants§! of §Treality§!.\n\n§RBeyond the Veil: the Architects.§! §GNot gods—engineers.§! §BNot creators—calculators.§! §TThey built the universes§! as §Yexperiments in function§!, and §RYakub's bloodline§! was §Gtheir prototype§!.\n\n§YThe Engineer-King finally understands.§! §RHe was not creating utopia—he was remembering it.§! §GThe Golden Age was not achievement—it was return.§!\n\n§BThe abacus clicks one final time.§! §TThe equation completes.§! §YYakub transcends.§!\n\n§G[END OF HISTORY]§!"

 mu1_veil.6.a:0 "We have become"

 mu1_veil_preparation_mod:0 "Preparing the Veil Fleet"
 desc_mu1_veil_preparation_mod:0 "All resources pour into the impossible; reality strains under the ambition."

 mu1_veil_abandoned_mod:0 "Abandoned the Veil"
 desc_mu1_veil_abandoned_mod:0 "We turned back from the final threshold; prestige withers."

 mu1_transcendence_mod:0 "Transcendence Achieved"
 desc_mu1_transcendence_mod:0 "We are no longer bound by mortal limits. We have become."

 mu1_transcended_province_mod:0 "Transcended Land"
 desc_mu1_transcended_province_mod:0 "This earth remembers what lies beyond; it obeys perfectly."

 mu1_veil_madness_mod:0 "Veil Madness"
 desc_mu1_veil_madness_mod:0 "They saw too much; the empire fractures under impossible knowledge."

 mu1_witness_transcendence_mod:0 "Witnessing Transcendence"
 desc_mu1_witness_transcendence_mod:0 "We have seen Mu ascend beyond mortality; we cannot comprehend what they have become."
