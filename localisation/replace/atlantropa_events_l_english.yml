 plotstart_events.12.t: "Kingdom of Aquesolis"
 plotstart_events.12.d: "The Kingdom of Aquesolis arose from the ruins of the Visigothic Empire. Its people speak Iberish, a mix of Celtiberian, Norwegian and Old Germanic, and it is unusually liberal for its time, governed by a charter of freedoms that guarantees a parliament in its capital, Roxburgshire. Founded by the charismatic King Alfred, it grew powerful thanks to its fleet, which controls the trade routes of the western sea. But quarrelsome nobles at home and hostile Hibernians and Visigoths abroad threaten it. Aquesolis dreams of conquering all of Albion. Time will tell if it succeeds."
 plotstart_events.12.a: "God Save the King"
 niflheim_empire.1.t: "The Svart Imperium Kort"
 niflheim_empire.1.d: "The Svart Imperium Kort, the Black Imperial Charter, has been signed between the Emperor of Niflheim and the representatives of the realm's states. Crafted from black stone inlaid with gold and silver, it bears the royal crown within a golden sun. The charter makes the Emperor's power inviolable: no state may question his decisions, and he alone may make laws and decrees. In return, the Emperor swears to protect his subjects, respect their rights and always act in the best interest of Niflheim."
 niflheim_empire.1.a: "God Save the Emperor"

 niflheim_empire.2.t: "Fall of Avalon"
 niflheim_empire.2.d: "The conquest of Avalon by the forces of Nilfheim is a tale of destruction and plunder that shook the very foundations of the city. The ruthless armies of Nilfheim, under the command of their formidable generals, unleashed a brutal attack, overwhelming the valiant defenders of Avalon. The city's once vibrant streets were turned into scenes of chaos and devastation as buildings crumbled and flames engulfed the once proud structures. During the merciless siege, the Nilfheim forces left no stone unturned, looting and pillaging everything in their path. Homes were ransacked, treasures were seized, and the city's cultural heritage was desecrated. The sorrowful cries of the citizens echoed through the air as their beloved Avalon succumbed to the horrors of war."
 niflheim_empire.2.a: "For the Emperor"
 niflheim_empire.3.t: "Conquest of Albion"
 niflheim_empire.3.d: "The Emperor of Niflheim has long coveted Albion, a misty land of fierce warriors and rich valleys. Now his armada has crossed the storm-wracked Niflhish Channel and our legions stand on Albion's shores. Some of its tribes and cities have already bent the knee, trusting our promise of fair rule. Others have taken to the hills, raiding our supply lines and swearing to fight to the last. The conquest of Albion has only begun."
 niflheim_empire.3.a: "For the Empire"
 niflheim_empire.4.t: "Svarta Imperiet"
 niflheim_empire.4.d: "Niflheim has proclaimed the Svarta Imperiet, the Black Empire. Under one banner, its lands will be governed by a centralized imperial administration led by the Emperor and his trusted advisors. But the proclamation is also a declaration of ambition: the Black Empire has unveiled plans for further conquest, far beyond its present borders. Niflheim has set out on the path of empire, and the world must reckon with it."
 niflheim_empire.4.a: "För Imperiet"
 plotstart_events.70.t: "The Kingdom of Niflheim"
 plotstart_events.70.d: "In the year 6450, the Kingdom of Niflheim emerged as a result of the Christianization of local Viking tribes. With its foundation rooted in the fusion of Norse traditions and Christian beliefs, Niflheim possessed a unique cultural and religious identity. However, it was the kingdom's ambitions that would leave an indelible mark on the world's history. The ambitions of Niflheim are not confined to mere territorial expansion. The kingdom wated to leave a lasting impact on the world stage. It foster a flourishing intellectual and artistic scene, attracting scholars, poets, and artisans from far and wide. Their contributions to knowledge, literature, and the arts elevated Niflheim's reputation and influence, will ensure its place in the annals of history."
 plotstart_events.70.a: "Mot Framtiden"
 plotstart_events.21.t: "The Bolgharians"
 plotstart_events.21.d: "Less than twenty years ago, a group of Bulgarians migrated into Dacia and settled the fertile lowlands between the Carpathians and the Danube. As the struggle for Constantinople grows ever more turbulent, their lands have become a buffer between the Rhomaioi Empire and the other powers fighting over the Balkans. The newcomers may yet become a major player in the region as they seek to carve out their place among the great powers."
 plotstart_events.21.a: "City awaits"
 plotstart_events.22.t: "The Fjordland"
 plotstart_events.22.d: "Fjordland, a small realm cut off from Denmark by mountains and bordered by Slavic kingdoms, may look like a humble fishing kingdom. But its tenacious people dream of joining the great powers of Scandinavia. They want more than conquest: they seek to become a centre of trade, art and learning. Lying on the North Sea between the Slavic kingdoms and the rest of Scandinavia, Fjordland is well placed to realize its ambitions."
 plotstart_events.22.a: "That's our story"
