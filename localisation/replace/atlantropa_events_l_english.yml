 castellowar.1.t: "Victory of Castellon"
 castellowar.1.d: "The war between the two kingdoms has raged for years. Now King Juan II has gathered his army and the forces of his allies and laid siege to Burgos, the stronghold of King Fernandez II. Cut off from supplies and reinforcements, the defenders held out for months, but with the king himself leading from the front, our troops finally breached the walls. Fernandez II surrendered and renounced his claim to the city. True to his reputation for magnanimity, Juan II offered generous terms and spared Burgos from destruction."
 castellowar.1.a: "Larga Vida al Rey"
 castellowar.2.t: "Victory of Burgos"
 castellowar.2.d: "King Fernandez II of Burgos has struck back against his rival, King Juan II de Trastamara. His army marched on Castellon and laid siege to the city, cutting it off while siege engines battered its walls. Juan II's counterattacks were repelled. After weeks of fighting, Fernandez II led the final assault himself, his troops stormed the breaches, and Juan II was forced to surrender. The fall of Castellon is a turning point in the dynastic war and secures Fernandez II's claim to power."
 castellowar.2.a: "Larga Vida al Rey"
 greatsaxony.1.t: "Victory of the Queen"
 greatsaxony.1.d: "Queen Dorothae "the Impaler" has crushed the rebellion of Weissenstadt and Amberg. Her retribution was merciless: suspected rebels were rounded up and put on public trial, and those found guilty were tortured, mutilated and executed. The walls of both cities were torn down as a symbol of their lost liberties, and the rebel leaders were put on display as a warning to anyone else who would dare challenge the Queen."
 greatsaxony.1.a: "Ehre sei der Königin!"
 greatsaxony.2.t: "The Saxon Empire"
 greatsaxony.2.d: "After the conquest of Constantinople, Saxony reached the pinnacle of its power and control. It now faced one of the most crucial questions - what to name the new empire it had created. The leaders of Saxony pondered various options, taking into account both their military successes and the historical significance of capturing Constantinople."
 greatsaxony.2.a: "Choose Griechenreich"
 greatsaxony.2.b: "Choose Byzanzreich"
 greatsaxony.2.c: "Choose Ostrom"
 greatsaxony.2.e: "Choose Sachsenreich"
 empiresaxonculture: "§MWe will join the Greek Cultural Group§!"
 greatsaxony.4.t: "Question of Hellenization"
 greatsaxony.4.d: "With the fall of Constantinople and the rise of the Rhomaioi Empire, Greek culture has gained great prestige. In Saxony, many nobles and scholars now see their own tongue as crude beside Greek, and want to adopt it to align Saxony with the Rhomaioi legacy and win respect abroad. But many ordinary Saxons, especially in the countryside, are deeply attached to their language as part of who they are. The question of language and identity has become a bitter dispute in the kingdom."
 greatsaxony.4.a: "We should"
 greatsaxony.4.b: "German culture is better!"
 hyper_war.1.t: "Legacy of the Hyperwar"
 hyper_war.1.d: "Long ago, the Finnish and Korean Empires were closely linked, perhaps even one realm before the war that tore them apart. The Finns fought bravely against the Hwan Empire, but were forced to withdraw from Asia to face another enemy: Autism. That war consumed them, and the Hyperwar ended with both empires destroyed and the world in ruins. Only centuries later did Mesopotamia bring light back to humanity. Yet the echoes of the Hyperwar remain, from the strange kinship of Finnish and Korean to Finland's endless war on Autism."
 hyper_war.1.a: "Maamme!"
 hyper_war.2.t: "An Exploration"
 hyper_war.2.d: "A group of scholars, priests and adventurers set out from Kainuu to uncover the secrets of the temple of the Proto-Finnic Khaganate. They crossed forests and mountain passes, fending off wild beasts and hostile tribes, until they reached the ancient temple. Inside, they documented every carving and inscription, and in a hidden chamber they found a trove of ancient scrolls describing the rituals, traditions and government of the lost Khaganate."
 hyper_war.2.a: "Tämä on Hämmästyttävä"
 hyper_war.3.t: "The Frozen Doors"
 hyper_war.3.d: "The scrolls have been deciphered at last. Written in an ancient Finnish script far more advanced than ours, they reveal that the structure is not a temple, but a tomb: the resting place of a legendary warrior, destined to return one day. The scrolls tell of his great deeds and his bond with cosmic and divine forces. Deep within, the expedition has found a chamber sealed behind steel doors covered in elaborate frescoes. To open it, a puzzle must be solved, one that no one in the expedition can yet comprehend."
 hyper_war.3.a: "We have to open the doors"
 hyper_war.4.t: "The Frozen Riddle"
 hyper_war.4.d: "The symbols on the door posed a baffling puzzle. For days, the expedition studied its patterns, consulted ancient texts and the artifacts they had found, and sought the advice of local tribes and scholars. Slowly, piece by piece, the meaning of the puzzle began to emerge, and the explorers drew ever closer to opening the door."
 hyper_war.4.a: "We have to open the doors now"
 hyper_war.4.b: "We need a time!"
 hyper_war.5.t: "An agressive option"
 hyper_war.5.d: "The expedition made the decision to blast open the doors, understanding that time was of the essence. Despite the crude nature of the barrels of gunpowder they possessed, which paled in comparison to the mysterious technology that lay before them, they were determined to uncover the secrets within the chamber. With caution and careful preparation, the team set up the barrels strategically around the doors. They took measures to ensure their safety and minimize potential damage to the surrounding area. The atmosphere was tense as they ignited the fuses, stepping back to a safe distance. A thunderous explosion rocked the chamber, reverberating through the temple walls. Smoke billowed out, obscuring their vision. As it cleared, the expedition members cautiously approached the now-opened entrance, their hearts pounding with anticipation and trepidation."
 hyper_war.5.a: "Se toimi!"
 hyper_war.6.t: "The Doors is open"
 hyper_war.6.d: "As the doors swung open, the explorers beheld a grand mausoleum covered in carvings: the resting place of Utuvi, the last and most legendary Khagan of the Finns. On its walls, they found clues describing a ritual of resurrection. Studying the inscriptions closely, they pieced together its steps, which require knowledge of ancient Finnish traditions, the alignment of the stars and sacred artifacts hidden within the temple."
 hyper_war.6.a: "We should do it"
 hyper_war.6.b: "It's madness"
 suomueskoendhyper: "End the Hypersuomi plot (and whole content)"
 hyper_war.7.t: "The ritual"
 hyper_war.7.d: "The expedition has decided to proceed with the ritual to resurrect Utuvi, the last Finnish Khagan. Following the ancient inscriptions to the letter, the explorers prepared the burial chamber, donned ceremonial robes and began the incantations. As the ritual reached its climax, an eerie light filled the tomb and whispers in a forgotten language echoed in their minds. Then the stillness broke. Utuvi's eyes, closed for millennia, slowly opened. The last Khagan of the Finns stands among the living once more."
 hyper_war.7.a: "Herranjumala!"
 war_of_the_roses.1.d: "The Kingdom of the Franks has long been a loose patchwork of nearly independent princes. Now the Plantagenet king is dead, and the War of the Two Roses has begun. Prince Reynard of the House of Puteaux, cunning and ambitious, promises his allies spoils and greater autonomy. Princess Isabella of the House of Chatou, wise and diplomatic, stands for a strong, unified crown and has won over the clergy and many great lords. Every prince must now choose a side."
 war_of_the_roses.1.a: "Support the Princess Isabella"
 war_of_the_roses.1.b: "Support the Prince Reynard"
 war_of_the_roses.1.d: "The Kingdom of the Franks has long been a loose patchwork of nearly independent princes. Now the Plantagenet king is dead, and the War of the Two Roses has begun. Prince Reynard of the House of Puteaux, cunning and ambitious, promises his allies spoils and greater autonomy. Princess Isabella of the House of Chatou, wise and diplomatic, stands for a strong, unified crown and has won over the clergy and many great lords. Every prince must now choose a side."
 war_of_the_roses.1.a: "Support the Princess Isabella"
 war_of_the_roses.1.b: "Support the Prince Reynard"
 french_empire.7.t: "The Question of War"
 french_empire.7.d: "We are caught in the middle of the War of the Two Roses, and our choice will shape our future. Prince Reynard of the House of Puteaux promises greater autonomy and the chance to expand our lands, but backing him means defying the House of Chatou. Princess Isabella of Chatou offers a strong, united kingdom that would bring stability and protection, but at the cost of some of our independence. Envoys from both sides have come to court us, and we must decide."
 french_empire.7.a: "Support the Princess Isabella"
 french_empire.7.b: "Support the Prince Reynard"
 french_empire.7.c: "Stay Neutral"
 french_empire.9.t: "Victory in the War of the Roses"
 french_empire.9.a: "Vive la Aquitania"
 french_empire.9.d_reynardvictory: "In the final days of the war, the Kingdom of the Franks was engulfed in a maelstrom of violence and desperation. Both sides had suffered heavy losses, and the once-thriving realm lay in ruins. The common folk, weary and exhausted, yearned for an end to the bloodshed that had consumed their lives for far too long. As the armies of Prince Reynard and Princess Isabella clashed on the battlefield, the stakes were higher than ever before. The outcome of this decisive battle would determine the fate of the Kingdom and the legitimacy of Reynard's claim to the throne. The soldiers fought with unmatched fervor, their loyalty to their respective leaders driving them forward despite the overwhelming fatigue. Reynard, a seasoned commander, led his forces with tactical brilliance and unwavering resolve. His troops, battle-hardened and fiercely devoted to their prince, fought with a determination that stemmed from their shared belief in the righteousness of their cause. They rallied around their banners, their cries of war echoing across the scarred landscape. On the opposing side, Princess Isabella remained steadfast in her convictions. She inspired her troops with her unwavering spirit and strategic acumen. Despite the mounting odds against her, Isabella's forces fought valiantly, their ranks demonstrating unwavering loyalty to their princess and the vision of a united and centralized Frankish Kingdom. The battle raged on for days, each side refusing to yield ground. Lives were lost, and the land became a tapestry of death and destruction. Yet, in the midst of the chaos, Reynard's forces gradually gained the upper hand. His tactical brilliance and the unwavering loyalty of his troops proved to be decisive factors in their eventual triumph. In a final, climactic push, Reynard's army broke through the enemy lines, shattering the morale of Isabella's forces. The battle turned into a rout as panic and disarray spread among the ranks of the opposing army. Isabella, recognizing the dire situation, made a strategic retreat, ensuring the survival of her remaining forces. The news of Reynard's victory spread like wildfire throughout the realm. The common folk, weary from years of war, greeted the news with a mixture of relief and trepidation. They hoped that the ascension of King Reynard would bring about an era of stability and prosperity, where their lives could finally return to some semblance of normalcy. Reynard, now hailed as the victorious king, assumed the throne with a sense of both accomplishment and responsibility. He knew that the war had taken a heavy toll on the realm and its people, and he was determined to rebuild and reunify the fractured Kingdom. With a newfound sense of purpose, he set out to mend the wounds of the war, to foster unity among the princes, and to restore the glory of the Kingdom of the Franks."
 french_empire.9.d_isabelvictory: "As the war neared its final days, the Kingdom of the Franks was engulfed in a somber atmosphere. Years of conflict had taken their toll on the land and its people. Cities lay in ruins, fields were scorched, and the once vibrant countryside had been transformed into a desolate wasteland. Queen Isabella, with her unwavering determination and the support of her loyal followers, pressed forward despite the adversities. She had witnessed the suffering caused by the war firsthand and was determined to bring an end to the bloodshed. With her military advisors by her side, Queen Isabella devised a strategic plan that would lead her forces to victory. She rallied her armies, composed of knights, foot soldiers, and mercenaries who had chosen to stand by her side in the pursuit of peace. The final battle was fought on a vast, barren plain, with the winds carrying the echoes of past battles. Isabella's forces faced the formidable army of Prince Reynard, who had proven to be a formidable opponent throughout the war. Banners flew high, and the clash of steel echoed across the battlefield as the two sides met in a decisive confrontation. Isabella's army fought with a renewed vigor, their spirits fueled by the vision of a united and prosperous Frankish Kingdom. They fought not only for their Queen but for the hope of a brighter future for generations to come. With each swing of their swords, they struck down the barriers that had divided the realm for far too long. The battle raged on for hours, with neither side willing to yield. Isabella, leading her troops from the front lines, demonstrated her unwavering resolve and exceptional leadership. She inspired her soldiers with her bravery and rallied them to fight with unmatched determination. In a pivotal moment, Isabella's forces managed to break through the enemy lines, creating a breach that soon turned into a rout. Prince Reynard's forces, caught off guard by the sudden turn of events, faltered in their defense. Panic spread among their ranks, and chaos ensued as Isabella's troops pressed their advantage. Realizing the battle was lost, Prince Reynard attempted to regroup his remaining forces, but it was too late. The tides had turned, and victory was within Isabella's grasp. With her troops pressing forward, they steadily gained ground, pushing the enemy further back until they were cornered and forced to surrender. The war came to an abrupt end as Prince Reynard, defeated and humbled, knelt before Queen Isabella. In a gesture of mercy, she spared his life but stripped him of his lands and titles. It was a symbol of her commitment to unity and reconciliation, even in the face of victory. The news of Queen Isabella's triumph spread like wildfire throughout the realm. Joyous celebrations erupted as people from all corners of the Kingdom rejoiced in the end of the long and devastating war. Isabella's victory marked a new era of hope and rebuilding for the fractured Frankish Kingdom."
 french_empire.5.t:"Guerre des Princes"
 french_empire.5.d:"Duke $MONARCH$ is well aware that war is coming. His spies report the preparations of our enemy, and he has wasted no time in sending envoys to neighbouring duchies with grievances of their own. His council of veteran commanders and strategists has drawn up plans to defend the borders and strike back. Farmers and labourers are being conscripted, siege engines and fortifications built, and scouts sent out to find the enemy's weaknesses."
 french_empire.5.a:"Invade them"
 french_empire.5.b:"Halt Actions"
 french_empire.6.t:"Ask for help"
 french_empire.6.d:"Your Majesty, I humbly write to you in a time of dire need. Our beloved Duchy of $COUNTRY$ has come under attack from the forces of neighboring duchy. Our lands and people face great peril, and we implore Your Majesty's assistance in repelling this aggression. We stand ready to defend the Kingdom, but we beseech your aid and guidance in this crucial hour. Yours faithfully, Duke $MONARCH$ of $COUNTRY$."
 french_empire.6.a:"Send the Aid"
 french_empire.6.b:"Good Luck"
 CHRISTIANSCHISMAISCOMING:"§RA Formation of Church opportunity§!"
 byzantiumhavelessthan30years:"§RIf we wish to preserve our religious influence in the East, it is imperative that we retake Constantinople within the next 30 years.§!"

 chalcedonism_fall.1.t:"§REastern Schism is coming§!"
 chalcedonism_fall.1.d:"Though united under the banner of Christ, the Christian world begins to show signs of fragmentation. The Greek, emboldened by imperial ambitions, move to establish independent ecclesiastical structures. These developments drift away from the core teachings of Jesus Christ, threatening the unity of the faith. Action must be taken before this division becomes irreversible."
 chalcedonism_fall.1.a:"Deus nos protegat"
 chalcedonism_fall.2.t:"§RFall of Jerusalem§!"
 chalcedonism_fall.2.d:"Jerusalem has fallen. The city sacred to three faiths, which for centuries drew pilgrims from every corner of the world, has been taken by pagan invaders. Its defenders fought bravely, but they were overwhelmed. The holy places have been desecrated, the faithful are persecuted, and many have fled or been taken captive. The pagans now seek to erase the sacred heritage of the Holy City."
 chalcedonism_fall.2.a:"Deus adiuva nos"
 chalcedonism_fall.3.t:"§RFall of Antioch§!"
 chalcedonism_fall.3.d:"Antioch has fallen. For centuries this city at the crossroads of East and West was a meeting place of cultures, trade and learning. Its walls could not withstand the pagan invaders, and despite the courage of its defenders, it was overwhelmed. The conquerors plundered its treasures, its people were dragged into slavery far from home, and its rich and diverse heritage is being stamped out. The wound left by the fall of Antioch will never fully heal."
 chalcedonism_fall.3.a:"Deus adiuva nos"
 chalcedonism_fall.4.t:"§RFall of Alexandria§!"
 chalcedonism_fall.4.d:"Alexandria, beacon of knowledge and culture, has fallen to the pagans. For centuries its great library drew scholars from across the world and its many peoples lived side by side. Its defenders fought bravely, but they could not hold against the invaders. The library was set ablaze, and with it burned the wisdom of countless generations. Its streets are stained with blood, its monuments lie in ruins, and its people suffer under the conquerors who seek to erase their faiths."
 chalcedonism_fall.4.a:"Deus adiuva nos"
 chalcedonism_fall.5.t:"§RThe Fate of the Greek Church§!"
 chalcedonism_fall.5.d:"For almost fifty years, the accursed Latins have held our capital. Constantinople, once the glorious heart of our empire and of Christianity, groans under their rule, and the Patriarch's authority has withered in the shadow of Rome. The faithful now look to Rome for guidance, and our traditions are fading. We must hold fast to our faith and pray for the day the Latins are driven out and our empire rises again."
 chalcedonism_fall.5.a:"Deus nos protegat"
 chalcedonism_fall.6.t:"§RChristianity Endures§!"
 chalcedonism_fall.6.d:"The Greek challenge to Christian unity has been overcome. Through decisive action and steadfast faith, the Church has preserved its structure and teachings against imperial deviation. The threat of schism has been averted-for now-and the authority of the true doctrine remains unshaken. The status quo is restored, and the faithful rejoice."
 chalcedonism_fall.6.a:"Deus Vult"
 chalcedonism_fall.7.t:"§RThe Great Schism§!"
 chalcedonism_fall.7.d:"Defying the authority of the unified Christian tradition, the Greeks have founded their own patriarchal church. With a centralized hierarchy and distinct theological doctrines, this new institution marks a formal break from the core teachings of Christianity. The Eastern Church now stands apart-structured, sovereign, and determined to forge its own sacred path."
 chalcedonism_fall.7.a:"Proditio!"
 byzantine_war.320.t:"Conquest of Constantinople"
 byzantine_war.320.d:"Armenian forces have seized Constantinople! The capture of this legendary city is a triumph of our national pride and perseverance, and it opens a new era of Armenian influence. Under the Armenian flag, Constantinople is once again a meeting place of peoples, where Armenians, Romans and many others live side by side in a flourishing of trade, art and learning. Our people are filled with pride and hope."
 byzantine_war.320.a:"P’arrk’ Mets Hayots’"
 armenian.events.1.t:"The Church of the East"
 armenian.events.1.d:"As Armenia's borders expanded, so did the reach of the Armenian Church. Missionaries followed our armies, and many in the conquered lands embraced our faith and customs. Contact with the East Syriac and Coptic Churches has drawn the Eastern Christians closer together. Today the Armenian Church is respected across the Middle East as a leading voice of Eastern Christianity, and its liturgy and traditions have left a lasting mark on the region."
 armenian.events.1.a:"Astvats mets e"
 armenian.events.2.t:"The Great Armenia"
 armenian.events.2.d:"For generations, the Armenians endured conquest and oppression, but never gave up the dream of a free homeland. Through hard-fought battles and careful alliances, our kings have reclaimed our ancestral lands city by city. Today Greater Armenia stretches from the Mediterranean to the Caspian Sea. The ancient dream of an Armenia from sea to sea has come true, and our kingdom is set to become a beacon of culture, trade and learning."
 armenian.events.2.a:"P’arrk’ mez"
 eprius_events.1.t:"Liberation of Constantinople"
 eprius_events.1.d:"The Despotate of Epirus has torn Constantinople from the Crusaders! Now its rulers face a choice that will define their realm. They could restore the Roman Empire, reviving its institutions and legacy and seeking to reunite the scattered lands of Ilium. Or they could embrace their Greek heritage and found a new Kingdom of the Greeks, free from the burdens of the past. Whatever they choose, the fate of the city of Constantine is now in their hands."
 eprius_events.1.b:"Restore the Empire"
 eprius_events.1.a:"We prefer to keep our Greek Heritage"

 daqin_events.1.t:"An Exiled Legion"
 daqin_events.1.d:"Long ago, after a disastrous war with Parthia, a band of exiled legionnaires led by Marius Pontylius wandered east for years until they reached the highlands of northern Tibet. There they founded Daqin, blending Roman traditions with Tibetan culture. Today Daqin is a vassal of the Jin Emperor of Northern China, yet it guards its Roman identity fiercely. In its palaces and garrisons, ambitious prefects and generals whisper of independence. Will Daqin remain a loyal vassal, or reclaim the glory of ancient Rome?"
 daqin_events.1.a:"We have to change our fate!"
 daqin_events.2.t:"The Roman Legions"
 daqin_events.2.d:"Inspired by the military traditions of ancient Rome, Daqin is raising new legions. Seasoned commanders drill veterans and recruits alike in discipline and loyalty, reminding them of the Roman heritage that unites them despite their diverse origins. As the legions grow in strength, Daqin can at last assert its independence, cautiously engaging its neighbours in diplomacy while its new army stands as a warning to anyone who would threaten its lands."
 daqin_events.2.a:"Our army will be invincible."
 daqin_events.3.t:"First Conquest"
 daqin_events.3.d:"With skilled military strategists at the helm, Daqin carefully assessed the geopolitical landscape, identifying regions where its neighbors' defenses were at their weakest. Sensing a moment of advantage, the legions were mobilized and readied for action. Daqin's first target was a neighboring state plagued by internal divisions and political instability. Its rulers were preoccupied with their own internal struggles, leaving their borders inadequately guarded. Taking advantage of this moment of weakness, Daqin's legions swiftly struck, launching surprise attacks on key fortresses and cities. The swift and decisive nature of Daqin's offensives caught its neighbors off guard, leaving them with little time to mount an effective defense. In a series of meticulously planned campaigns, Daqin's legions swiftly advanced, capturing strategic territories and expanding its borders."
 daqin_events.3.a:"Good Job"
 daqin_events.4.t:"The Kingdom of the East"
 daqin_events.4.d:"Our new lands have brought Daqin rich farmland, busy trade routes and valuable resources, and our economy is flourishing. Our administration now embraces the diverse cultures of our subjects, and our monarchy, descended from the hero Marius Pontylius, enjoys the loyalty of the people. Our neighbours have taken notice, some with caution and some with offers of friendship. Daqin is no longer a vassal in the shadows. It has become a power to be reckoned with."
 daqin_events.4.a:"For Glory!"
 daqin_events.5.t:"The Question of Faith"
 daqin_events.5.d:"For generations Daqin has honoured the old Roman gods, with Jupiter at their head. Now a new movement argues that as descendants of Mars, the Romans of Daqin should devote themselves to him alone, and win his favour on the battlefield. Traditionalists call this a betrayal of our heritage, while its supporters see it as a return to the martial spirit of our ancestors. The debate has divided priests, scholars and generals alike, and the monarch must now decide the future of Daqin's faith."
 daqin_events.5.a:"Keep old Faith"
 daqin_events.5.b:"They are Right!"
 daqin_events.6.t:"The Question of Natives"
 daqin_events.6.d:"Daqin's new lands are home to many tribes, each with its own language and customs. Some advisors want them Romanized: Roman law, language and customs imposed on all, binding the kingdom together. Others warn that forced assimilation will breed resentment and rebellion, and argue that the tribes should keep their own ways and local rulers. Too much Romanization could alienate our new subjects, but too much autonomy could tear the kingdom apart."
 daqin_events.6.a:"Let them be"
 daqin_events.6.b:"We have to Romanize them"
 daqin_events.7.t:"First Preparations"
 daqin_events.7.d:"The ambitious idea of conquering Peking and seizing power over China swept through the highest echelons of Daqin's leadership once the majority of the kingdom's internal challenges had been addressed. The allure of the legendary wealth and splendor of China enticed the rulers, sparking dreams of extending Daqin's dominion beyond its borders and solidifying its status as a dominant regional power. The decision to pursue such an audacious conquest was not taken lightly. It entailed meticulous planning, strategic alliances, and a formidable military force to even contemplate challenging the mighty empire of China. The prospect of venturing into uncharted territories and confronting a vast and ancient civilization stirred a mix of excitement and trepidation among the kingdom's leaders."
 daqin_events.7.a:"Focus on Quantity"
 daqin_events.7.b:"Focus on Quality"
 daqin_events.8.t:"§RMarch on Beijing§!"
 daqin_events.8.d:"On the first day of the war, the legions of Daqin marched out toward Peking, their armour gleaming in the morning sun. The war council reviewed its plans one last time, knowing the fate of the kingdom rested on this campaign. With banners unfurled and horns sounding, the legions set forth as crowds lined the streets of the capital, proud and anxious, bidding farewell to their soldiers."
 daqin_events.8.a:"The war has begun!"
 daqin_events.9.t:"§RFall of Beijing§!"
 daqin_events.9.d:"On the final day of the war, Daqin's legions surrounded Peking with their siege engines ready. The defenders fought with courage and desperation, but our legions pushed forward inch by inch. At last the gates gave way to our battering rams and the walls were breached. Our soldiers poured into the city, and its weary, outnumbered defenders could resist no longer. Peking has fallen, and with it, the ancient empire of China lies in the hands of Daqin."
 daqin_events.9.a:"The City has Fallen"
 daqin_events.10.t:"The Question of Administration"
 daqin_events.10.d:"Peking has fallen and China is ours, but conquering it was the easy part. Governors have been sent to every province, troops garrison the key cities, and new roads and trade routes are binding the land to the rest of the Empire. Many Chinese still remain loyal to their old rulers. Whether they come to see themselves as subjects of Daqin will depend on how wisely we rule in the years ahead."
 daqin_events.10.a:"It's much to be done"
 daqin_events.11.t:"The Question of Language"
 daqin_events.11.d:"The conquest of China has brought a clash of cultures, and Daqin's Roman rulers must decide how to treat the Chinese. Some want aggressive Romanization: Latin, Roman customs and symbols spread across the conquered lands to build a true Rome of the East. Others argue for embracing elements of Chinese language, script and culture, believing that respect for the Chinese heritage would win the loyalty of our new subjects."
 daqin_events.11.a:"We cannot give up our Roman heritage"
 daqin_events.11.b:"We have to adapt the Chinese Culture"
 daqin_events.12.t:"The Question of Faith"
 daqin_events.12.d:"Most of our new subjects follow Confucianism, deeply woven into Chinese life, while our own Hellenistic faith is little known here. Adopting Confucianism as the state religion could win the trust of the Chinese and strengthen our rule. But it would mean abandoning the faith of our European ancestors, and many of our people would resist giving up the old gods."
 daqin_events.12.a:"We cannot give up our Roman heritage"
 daqin_events.12.b:"We have to adapt the Chinese philosophy"
 daqin_events.13.t:"The Question of Capital"
 daqin_events.13.d:"Peking is the obvious choice for the capital of the New Empire of Daqin, but its future is hotly debated. Some want it preserved under its old name, out of respect for its history and heritage. Others want it renamed "New Rome of the Far East", a symbol of Daqin's Roman roots and imperial ambition. Still others would plunder its riches as a sign of conquest and move the capital far to the west."
 daqin_events.13.a:"Ensure the status quo"
 daqin_events.13.b:"Build a New Rome"
 daqin_events.13.c:"Burn this town"
 daqin_events.14.t:"The Question of the Legions"
 daqin_events.14.d:"By old Roman tradition, victorious legionnaires are owed land and money, but rewarding all who conquered northern China would be ruinously expensive. Some advisors suggest relying instead on the Chinese themselves and raising a new army from them, saving money and winning the trust of our new subjects. The rulers of Daqin must weigh the loyalty of the legions against the need to bind China to the new empire."
 daqin_events.14.a:"Give them what they want!"
 daqin_events.14.b:"Betray them"
 daqin_events.15.t:"The Question of the Court"
 daqin_events.15.d:"Who should rule the New Empire of Daqin? Some advisors want power kept in Roman hands, trusting experienced Roman officials familiar with imperial traditions to govern the conquered lands and keep the empire united. Others argue that the local Chinese elites must be brought into the administration, for no one knows these vast and varied lands better, and sharing power would win their cooperation."
 daqin_events.15.a:"Keep the Roman Elites"
 daqin_events.15.b:"Invite the Chines to the Court"
 daqin_events.16.t:"The Pontylia Epos"
 daqin_events.16.d:"The Pontylia Epos tells of Marius Pontylius, who escaped the Roman disaster at Carrhae with a handful of loyal soldiers. Their flight took them across deserts, mountains and jungles, through India and into the Far East, until they settled in the highlands of northern Tibet and named their new home Daqin. Marius taught the locals Roman engineering and law, and in turn embraced their customs. His tale is now the cornerstone of Daqin's culture, a story of courage and of East and West becoming one."
 daqin_events.16.a:"A true Masterpiece"
 czeskitooltipstartowy:"§MAs the Kingdom of Vangionea, we must capture the capital of Venedia by the time of the free election in the year 6503; otherwise, we will lose the opportunity to ascend to the royal throne of Venedia.§!"
 venediaevent.59.t:"The Vangionean Invasion"
 venediaevent.59.d:"After the great battle of Gniesdow, in which the King of Venedia fell, the powerful Czech nobles representing the young Czech Queen Maria II Premyslid decided to invade Venedia. Their aim was to install her on the throne of the chaos-stricken kingdom of Venedia. However, the Kingdom of Czech must act swiftly, for an Election has been scheduled in the year 6502 for the Venedian throne, with the likelihood of the King of Aquitaine being chosen. In such a situation, seizing the Venedian throne will become impossible. The clock is ticking for the Czech kingdom as they must hasten their efforts to secure the throne for the rightful queen amidst the turbulent times of Venedia."
 venediaevent.59.a:"We have to be hurry!"
 venediaevent.58.t:"Venedia Endures"
 venediaevent.58.d:"On the final day of the war, Venedia stood firm. The Czech knights fought hard to place Queen Maria II Premyslid on the Venedian throne, but our defenders, loyal to their kingdom, threw them back. When the Czechs learned that a Free Election would be held in Venedia, they laid down their arms and abandoned their sieges. Accepting defeat with honour, they returned home, recognizing the right of the Venedian people to choose their own ruler."
 venediaevent.58.a:"Gon pepików z naszej ziemi!"
 venediaevent.60.t:"Czech Victory"
 venediaevent.60.d:"On the final day of the war, the capital of Venedia, Zlotowille, fell to the Czechs. The victorious Czech nobles gathered in the so-called Silent Sejm, an assembly where not a word was spoken, and proclaimed the young Czech Queen Maria II Premyslid Queen of Venedia. In the heart of the war-torn city, she was solemnly crowned before Czech nobles and Venedian delegates. Many in both realms hope this union will finally bring stability and prosperity."
 venediaevent.60.a:"At zije Kralovna"
 atl_phoenix_metropolies:"Italian Cities"
 atl_phoenix_TRUTH:"Imperial Propaganda"
 atl_phoenix_embargo:"Closed Economy"
 atl_phoenix_imperial_economy:"National Economy"
 atl_phoenix_imperial_cult:"Cult of the Royal Family"
 atl_phoenix_prohibition:"Alcohol Banned"
 atl_phoenix_navy:"Flotta Rossa"
 phoenix_reorganized_army:"Guardia Infuocata"
 phoenix_heavy_shippower:"Messinan Navy"
 phoenixempire_events.1.t:"§JThe Great Awaken§!"
 phoenixempire_events.1.d:"After the Great Awaken, a neo-pagan movement called the Solar Reformation swept across Europe, and nowhere did it burn brighter than in Messina, long dominated by the Catholic Church. The old gods Jupiter, Neptune and Mars have found new devotion. The reformers have chosen a symbol: the §OPhoenix§!, the firebird reborn from its own ashes, an image of rebirth that captures their dream of restoring the ancient faith. Messina stands at the start of a spiritual and cultural renaissance."
 phoenixempire_events.1.a:"They should be right"
 phoenixempire_events.2.t:"§OQuestion of the Faith§!"
 phoenixempire_events.2.d:"A proposal to restore the Hellenistic faith as Messina's state religion has sparked fierce debate. Its supporters, swept up in the fervour of the Solar Reformation, believe that honouring Jupiter, Neptune and Mars would reconnect our people with their heritage and restore a sense of purpose lost under the Catholic Church. But others fear it would alienate those who hold to Christianity, and wonder how different faiths could coexist in Messina."
 phoenixempire_events.2.a:"That's a nonsense"
 phoenixempire_events.2.b:"§OWe Trust the true Gods!§!"
 phoenixempire_events.3.t:"§ORise of the Phoenix Empire§!"
 phoenixempire_events.3.d:"Having embraced Hellenism, our elites have proclaimed the Phoenix Empire, protector of the pagan faiths. We honour the wisdom of Jupiter, the power of Neptune and the courage of Mars, and we will never again allow our heritage to be suppressed. This sets us against the Catholic Church, which has long sought to erode our ancient beliefs. Our path will meet opposition, but we stand firm as defenders of our traditions and of a future free from foreign control."
 phoenixempire_events.3.a:"Choose the English Name"
 phoenixempire_events.3.b:"Choose the Italian Name"
 phoenixempire_events.3.c:"Choose the Latin Name"
 sacco_rzymu:"Sacco di Roma"
 fenikswypadniezhre:"§RPhoenix Empire will be REMOVED from the Holy Roman Empire§!"
 phoenixempire_events.4.t:"§OFate of Rome§!"
 phoenixempire_events.4.d:"On the last day of the siege of Rome, the Emperor stands on a hill above the ancient city. Our army came to assert the might of the new Empire and to take the city that once ruled over our ancestors. Now the Emperor must decide: should Rome be preserved for its history, or destroyed as a symbol of the Phoenix's triumph over foreign domination? This choice is more than strategy. It will declare what the Phoenix Empire truly stands for."
 phoenixempire_events.4.a:"Keep the City"
 phoenixempire_events.4.b:"§OBurn this Town§!"
 phoenixempire_events.5.t:"§OThe Emperor's Move§!"
 phoenixempire_events.5.d:"As unrest spread across the Empire, the Emperor summoned an emergency assembly. He knew force alone could not end the chaos, so he chose a bolder path: to harness the Neo-Pagan Puritans. He praised them as the vanguard of the Empire's purification, steered their zeal away from riots and toward his own enemies, and invited their leaders to help shape his policies. Flattered by this new influence, the Puritan leaders have embraced the Emperor's vision. For now."
 phoenixempire_events.5.a:"Let The Revolution Continue"
 phoenixempire_events.6.d:"With the Emperor's blessing, the Puritan militias have turned on the Catholics and other Christians. Churches are burned to the ground, priests are hunted down, tortured and crucified in public as a warning to others, and entire towns have been scarred by massacres. Catholic families must choose between renouncing their faith and facing the consequences. Fear and suspicion grip the Empire, and neighbours betray neighbours in the name of purity."
 phoenixempire_events.6.t:"§RTerror in Phoenix Empire§!"
 phoenixempire_events.6.a:"Let The Revolution Continue"
 phoenixempire_events.7.t:"Exodus from Phoenix Empire"
 phoenixempire_events.7.d:"The Puritans' first victims were the Empire's minorities in Greater Greece: Greeks, German settlers and Jews. With the Emperor's patronage, Puritan squads burned their homes to drive them out, and often massacred those who stayed. Within a single year, much of the targeted population had fled the Empire. Cities that were once home to many peoples now echo with an eerie emptiness."
 phoenixempire_events.7.a:"Let The Revolution Continue"
 phoenixempire_events.8.t:"Opposition Targeted"
 phoenixempire_events.8.d:"The Emperor has turned the Puritans' fury on his internal enemies: wealthy nobles and powerful clergymen. Accused of conspiracies real or invented, they are dragged into show trials, stripped of their lands and wealth, and imprisoned, tortured or executed in public as a warning to others. Fear has silenced all dissent, the political and intellectual life of the Empire has been crushed, and the Emperor's grip on power is now absolute."
 phoenixempire_events.8.a:"Let The Revolution Continue"
 phoenixempire_events.10.t:"§ORegional Empire§!"
 phoenixempire_events.10.d:"After the conclusion of the Cultural Revolution and the reunification of northern Italy, the Phoenix Empire emerged as a significant regional power in Europe. Its culture and religion rapidly spread throughout the empire, solidifying its influence. With stability regained, the time was ripe for the empire to contemplate its next steps. The newfound unity and strength of the Phoenix Empire provided a solid foundation for further expansion and influence. The cultural and religious identity fostered during the upheavals of the past had now taken root and flourished. This cultural renaissance, combined with the strategic successes of the empire, laid the groundwork for a new era of growth and prosperity."
 phoenixempire_events.10.a:"We should conquer whole Europe"
 phoenixempire_events.11.t:"§OThe Great Conquest§!"
 phoenixempire_events.11.d:"With the Phoenix Empire 'purified' and imperial authority secure, a new idea has taken hold: the Great War. Its aim is nothing less than to restore the borders of the ancient Roman Empire and dominate all of Europe. It is a bold vision rooted in our Hellenistic heritage, but it will test not only our armies but our diplomacy and statecraft. The Empire stands at a crossroads of history."
 phoenixempire_events.11.a:"We will conquer whole Europe"
 phoenixempire_events.13.t:"§OThe Fall of Constantinople§!"
 phoenixempire_events.13.d:"After a long siege, the Phoenix Empire's legions broke through the walls of Constantinople at dawn and fought their way into the heart of the city. By the end of the day, the banner of the Phoenix flew over the Hagia Sophia. The Empire has renamed the city the Purple Phoenix: red for the reborn Phoenix Empire, purple for the Roman heritage of the East. The name is a bold statement. The Phoenix Empire claims the legacy of both Eastern and Western Rome."
 phoenixempire_events.13.a:"The City has fallen"
 phoenixempire_events.14.t:"§OThe Holy Phoenix Empire§!"
 phoenixempire_events.14.d:"With most of Europe under its banners, the Phoenix Empire has taken the next step and proclaimed the Holy Phoenix Empire, a realm meant to unite the whole continent under one authority, as Rome once did. Guided by the Imperial Creed and the ancestral gods, the old nations and their rivalries are to be swept away and replaced by a single European identity. To its followers, this is the dawn of a new age. To its enemies, it is the end of everything they knew."
 phoenixempire_events.14.a:"Glory for the Empire"
 phoenixempire_events.16.t:"§RThe Great Colosseum§!"
 phoenixempire_events.16.d:"As the sun set over the reborn Colosseum, the crowd fell silent. Catholic clergymen were led into the arena, their faces a mix of fear, defiance and resignation. The Emperor pronounced their sentence, and the executioners stepped forward. The killing was swift and brutal. When it was over, no one present could doubt the message: the Phoenix Empire will not be challenged, and the old order will be swept away. The Colosseum, once a place of entertainment, is now a monument to the Empire's power."
 phoenixempire_events.16.a:"They deserved for that fate"
 phoenixempire_events.17.t:"§RSacco Di Roma§!"
 phoenixempire_events.17.d:"In the evening, the Emperor ordered Rome razed to the ground. The greatest city in the world burned brighter than in Nero's day. Most of its people were slaughtered and the survivors sold into slavery. The horror shook the Catholic world, and the Pope has proclaimed a crusade against the Phoenix Empire. But the Emperor has declared that from the ashes of the Christian city a new Hellenistic metropolis will rise, just as the phoenix rises from its own ashes."
 phoenixempire_events.17.a:"The City has burned"
 phoenixempire_events.18.t:"§OThe Phoenix Temple§!"
 phoenixempire_events.18.d:"The Temples of the Phoenix in Fenicio are complete. At their heart stands the Grand Phoenix Sanctuary, its golden domes rising above gardens and reflecting pools, its walls covered with mosaics of ancient myths and the Empire's triumphs. More than places of worship, they are centres of art and culture, and pilgrims already flock to them from across the Empire. The temples stand as proof that our people have truly risen from the ashes."
 phoenixempire_events.18.a:"So Magnificent"
 phoenixempire_events.100.t:"§OThe Phoenix Cultural Revolution§!"
 phoenixempire_events.100.d:"The revival of Hellenistic culture in the Phoenix Empire has given birth to the Neo-Pagan Puritans, zealots who believe the Empire must be 'purified' of corrupting influences. Born in intellectual circles, the movement now names its enemies openly: Catholics, Jews, Greeks, Germans and smaller minorities. Its charismatic leaders feed on years of simmering discontent, and isolated acts of vandalism have turned into organised violence. Now they call for a systematic 'cleansing' of the Empire, the first spark of a Cultural Revolution."
 phoenixempire_events.100.a:"So Magnificent"
 phoenixempire_events.101.t:"Wave of Violence"
 phoenixempire_events.101.d:"The wave of crimes continued to sweep through the Empire, leaving no corner untouched. Villages and towns that once lived in relative harmony were now consumed by a climate of suspicion, fear, and violence. The Puritans' fervor had ignited a destructive fervor within society, driving neighbors to turn against neighbors in a brutal cycle of betrayal. The very fabric of communities unraveled as accusations and paranoia took hold. Informants whispered accusations, real or fabricated, leading to mass denunciations and violent reprisals. It became increasingly common for entire families to be targeted, accused of harboring dissenting views or adhering to old traditions."
 phoenixempire_events.101.a:"That's necessary to be!"
 phoenixempire_events.102.t:"The Catholic Militiant"
 phoenixempire_events.102.d:"The escalating cycle of violence within the Empire continued as retaliatory acts ensued. In response to the attacks by Catholic militant groups, Catholic factions resorted to torching Hellenistic temples, seeking to strike back at symbols of the our beliefs. These devastating acts further deepened the divisions within the society, erasing cultural landmarks and inflaming passions on both sides."
 phoenixempire_events.102.a:"Damn"
 phoenixempire_events.103.t:"The Assault"
 phoenixempire_events.103.d:"The assault by the United Bands of Persecuted Minorities and Catholics against one of our cities proved to be a successful endeavor for them. As a retaliatory measure, Catholics mercilessly targeted and massacred our citizens, met with an alarming passivity from our own forces. In response, the Puritans resorted to a gruesome act, crucifying dozens of Catholics. Despite these retaliatory actions, the underlying problems remained unresolved, as the cycle of violence continued to spiral out of control, leaving the nation in a state of turmoil."
 phoenixempire_events.103.a:"Damn"
 phoenixempire_events.200.t:"§OThe End of Revolution§!"
 phoenixempire_events.200.d:"Ultimately, the Cultural Revolution came to an end, and the Phoenix Empire emerged cleansed. Despite the significant material losses, the Empire now stands poised for a renaissance, freed from all subversive elements. The tumultuous period of upheaval has paved the way for a new era of stability and growth, as the Empire's focus shifts toward cultural reinvigoration, societal unity, and the flourishing of its unique identity. The scars of the revolution are a reminder of the challenges overcome, as the Phoenix Empire rises from the ashes, stronger and more determined than ever before to shape its destiny!"
 phoenixempire_events.200.a:"Finally"
 phoenixempire_events.201.t:"§OQuestion of the Puritans§!"
 phoenixempire_events.201.d:"With the opposition crushed, the Emperor now sees the Puritans he once empowered as the greatest threat to his rule. He has sent their leaders an ultimatum: disband the movement at once. The Puritans face a hard choice. They have reshaped the Empire according to their beliefs, but defying the Emperor means open war with the imperial army. As their leaders argue over what to do, the Emperor waits for their answer."
 phoenixempire_events.201.a:"They will surrender"
 phoenixempire_events.202.t:"§OTreason§!"
 phoenixempire_events.202.d:"The Puritans have answered the Emperor's ultimatum with open rebellion. Instead of disarming, their forces surrounded the Capital and struck. The unprepared royal troops scattered, and the city quickly fell into Puritan hands. Now the castle, the very symbol of imperial power, is under siege, and the streets of the Capital have become a battlefield. The Emperor must act quickly, or lose his throne."
 phoenixempire_events.202.a:"Damn"
 phoenixempire_events.203.t:"§OBattle of Capital§!"
 phoenixempire_events.203.d:"Just as the royal castle was about to fall, the Guardia Infuocata struck the rebels from behind. The surprise attack threw the Puritans into chaos, and the battle in the streets of the Capital turned into a massacre. Pocket by pocket, the Guard crushed the remaining resistance and captured the Puritan leaders, who were swiftly executed. The rebellion is broken, the Emperor's authority restored, and the Guardia Infuocata hailed as saviours of the Empire."
 phoenixempire_events.203.a:"Thanks Gods"
  phoenixempire_events.204.t:"The Great Fire of Cologne Cathedral"
 phoenixempire_events.204.d:"In revenge against the Catholics, the Puritans set their sights on the great Cathedral of Cologne. At nightfall they descended on the city with torches, and soon flames engulfed its towering spires. The fire raged for hours, leaving only a charred ruin. The people of Cologne watched in shock and fury. The burning has provoked outrage across the Empire and abroad, and even some Puritans have begun to question their leaders."
 phoenixempire_events.204.a:"Bruh"
 catholicsaregonephoenix:"§OAll the Catholics fled the Empire§!"
 pax_phoenix:"§OPax Europa§!"
 pax_phoenixempire:"§OThe Great Conquest§!"
 phoenixempire_events.205.t:"§ORevelation of the Bird§!"
 phoenixempire_events.205.d:"From the royal scribe of Messyna: today the heavens seemed to tear apart. With a deafening roar, Mount Etna erupted, painting the sky crimson and black and burying the city in ash. Even our King, always so calm, trembled as he watched. Then he spoke words that now echo through the land: "Behold the sacred Phoenix, a messenger from the divine!" The people rallied to his call. None of us yet know whether we saw a holy sign or the awakening of some older, darker force."
 phoenixempire_events.205.a:"It's a bad Omen"
 phoenixempire_events.205.b:"Now I am Understanding!"
