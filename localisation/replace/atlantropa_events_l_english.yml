 nikean_empire.82.t: "§RAn Epilogue§!"
 nikean_empire.82.d: "The Roman Empire, existing for two thousand years, had its fair share of ups and downs throughout its history. However, in 6499, on the brink of collapse, a series of wise rulers helped the empire rise above all its problems, regain its former glory, and become the undisputed hegemon of Europe for the third time in its history. The empire's recovery was a slow and gradual process, led by a string of strong and capable leaders. As the years went by, the Roman Empire continued to expand its influence and power, eventually becoming the dominant force in Europe. Its culture and language spread far and wide, and even today, the legacy of the Roman Empire can be seen in the art, architecture, and language of many European countries."
 nikean_empire.82.a: "§MThank You for the playing§!"
 polishpope: "§MPapiez Polak§!"
 venediaevent.14.t: "§RVenedic Pope§!"
 venediaevent.14.d: "A great day for $COUNTRY$! For the first time in history, one of our cardinals has been elected Pope. Known for his devotion to the poor, his defence of human dignity and his openness to other faiths, the new Pope is a source of hope for many. In a land with a long Chalcedonian tradition, his election fills the nation with pride. In churches and public squares, people from all walks of life are celebrating and giving thanks."
 venediaevent.14.a: "§RHabemus Papam§!"
 aryan_empire.1.t: "Cult of the Qara Kün"
 aryan_empire.1.d: "A new era of shadows descended on Udmurtia as the Qara Kün cult, invoking divine mandate, seized the city in a blaze of fervent orthodoxy. Pyres crackled nightly, devouring heretics under the cult's twisted dogma, while the Kün Qorgaushy's iron patrols crushed dissent in the once-vibrant streets, their presence a suffocating veil of fear. The Ay Qarash wove its web of unwavering faith, indoctrinating the masses through ceaseless rituals that etched the Qara Kün's doctrine into every soul. From thriving hub to theocratic abyss, Udmurtia now simmered in obedience, where doubt burned away and fanaticism reshaped destiny in eternal twilight."
 atlantropapagan2: "An Eye Sacrifice"
 atlantropapagan3: "Son sacrifice"
 atlantropapagan4: "Human Sacrifice"
 restorationkosciol_events.4.t: "An offering to the Gods"
 restorationkosciol_events.4.d: "It is believed that when a new Chief takes over the leadership of the tribe, it is necessary to offer a sacrifice to the gods. The type of sacrifice can vary, and it usually involves offering food or sacrificing animals. However, in more extreme cases, the new Chief may choose to offer his own eye or even his son as a sacrifice to the gods. It is said that such sacrifices demonstrate the Chief's devotion to the gods and his willingness to do whatever it takes to ensure the prosperity and protection of his tribe. These rituals are carried out by the tribe's spiritual leaders, who interpret the will of the gods and guide the tribe in matters of faith and tradition."
 restorationkosciol_events.4.a: "Make a small sacrifice"
 restorationkosciol_events.4.ab:"Sacrifice some slaves"
 restorationkosciol_events.4.ac:"Sacrifice many slaves"
 restorationkosciol_events.4.b: "Sacrifice your own eye"
 restorationkosciol_events.4.c: "Sacrifice your own son"
 restorationkosciol_events.4.e: "Sacrifice the people from the local settlement"
 zpoganizowanyidea: "Gods are Unpleased"
 aryan_empire.2.t: "Turmoils in Aharta Uralis"
 aryan_empire.2.d: "After the fanatics of the Qara Kün seized power in the country, a visible division arose between the two factions in the country. On one side, the representatives of the Kün Qorgaushy demanded the expansion of the faith by force onto other states, while on the other side, there was the Ay Qarash, which believed in isolation and focusing on strengthening the faith within the kingdom. This led to a heated debate within the ruling council, with both factions refusing to back down from their positions. As a result, the country was in a constant state of political turmoil, with the two factions vying for dominance over the direction of the state's policies and actions."
 aryan_empire.2.a: "We need to do something"
 aryan_empire.3.t: "Lunars Demands Land"
 aryan_empire.3.d: "Today, in the morning, a messenger from the Ay Qarash arrived at the High Priest's quarters, demanding that his faction be granted lands in the kingdom. The High Priest listened to the messenger's demands, but reminded him that the allocation of lands was not within his authority, but rather a matter for the king and the council to decide. He also cautioned the messenger that the Ay Qarash should not act out of greed or ambition, but rather out of a genuine desire to spread and strengthen the faith within the kingdom. The messenger left, dissatisfied with the response, but the High Priest hoped that he had planted a seed of reason in his mind. But in the next day he come again demanding the land for him"
 aryan_empire.3.a: "Give them Lands"
 aryan_empire.3.b: "Refuse"
 aryan_empire.4.t: "Turmoils in Aharta Uralis"
 aryan_empire.4.d: "The unrest among the Lunar Clerics intensified after the king rejected their demands. After unsuccessful attempts at negotiations, a group of clerics decided to take radical steps and organize an armed uprising against the king. The leaders of the uprising were chosen from among the most experienced and determined Lunar Clerics. They quickly gained the support of many kingdom residents who were also dissatisfied with the king's rule. Soon, the group of rebels gathered enough forces to begin fighting against the royal forces."
 aryan_empire.4.a: "§MDamn Lunars§!"
 aryan_empire.5.t: "Turmoils in Aharta Uralis"
 aryan_empire.5.d: "The Kün Qorgaushy is unhappy with the preferential treatment that the Ay Qarash is receiving from the ruler. They feel that they are being left out of important decisions and are not being given the attention they deserve. Some members of the Kün Qorgaushy are even beginning to voice their concerns openly, which is causing tension within the kingdom. It remains to be seen how the ruler will address these concerns and whether they will be able to maintain unity within the kingdom."
 aryan_empire.5.a: "§YDamn Solars§!"
 lunarpleased: "§MLunars Pleased§!"
 lunarunpleased: "§MLunars Unpleased§!"
 solarpleased: "§YSolar Pleased§!"
 solarunpleased: "§YSolar Unpleased§!"
 aryan_empire.6.t: "Solars Demands Land"
 aryan_empire.6.d: "This morning, a messenger from the Kün Qorgaushy arrived at the high priest's chambers, demanding that their faction be granted more lands in the kingdom. The Kün Qorgaushy has been growing increasingly dissatisfied with the Ay Qarash's perceived favoritism by the ruler. They argue that their faction's contributions to the kingdom, such as organizing diplomatic affairs and leading holy crusades against heretics, should merit greater land allocations. Tensions have been rising between the two factions, and this latest demand from the Uralic messenger may exacerbate the situation further. The high priest is now tasked with mediating between the two sides and finding a solution that maintains peace and stability within the kingdom."
 aryan_empire.6.a: "Give them Lands"
 aryan_empire.6.b: "Refuse"
 aryan_empire.7.t: "Turmoils in Aharta Uralis"
 aryan_empire.7.d: "Due to the refusal to grant land, the Kün Qorgaushy rebelled against the high priest. They accused him of favoring the Ay Qarash and not considering the interests of the Kün Qorgaushy in the kingdom. The rebellion quickly spread throughout the kingdom, with the Kün Qorgaushy gaining support from other disgruntled groups who felt marginalized by the ruling cult of the Qara Kün."
 aryan_empire.7.a: "§YDamn Uralics§!"
 aryan_empire.8.t: "Turmoils in Aharta Uralis"
 aryan_empire.8.d: "The Ay Qarash is unhappy with the preferential treatment that the Kün Qorgaushy is receiving from the ruler. They feel that they are being left out of important decisions and are not being given the attention they deserve. Some members of the Ay Qarash are even beginning to voice their concerns openly, which is causing tension within the kingdom. It remains to be seen how the ruler will address these concerns and whether they will be able to maintain unity within the kingdom."
 aryan_empire.8.a: "§MDamn Lunars§!"
 solardevastating: "Hunting Heretics"
 lunardevastating: "Lunar Conscriptions"
 humansacrifices: "§RHuman Sacrifices§!"
 aryan_empire.9.t: "Hunting of Heretics"
 aryan_empire.9.d: "In the provinces, ruled by the Kün Qorgaushy, a great hunt for heretics took place. According to estimates, the fanatics burned down several villages in their pursuit. The Kün Qorgaushy, under the guise of rooting out heresy, has been known to use extreme measures to maintain their control over the population. This latest incident of violence is a clear example of the lengths they are willing to go to enforce their beliefs. The few survivors of the burned villages have fled to neighboring provinces, seeking refuge and safety from the Kün Qorgaushy's brutality. The situation is tense and the Lunar factions within the kingdom are watching closely, fearful of the Order's power and the possibility of similar atrocities occurring in their own territories."
 aryan_empire.9.a: "They are right"
 aryan_empire.9.b: "We need to stop them"
 aryan_empire.10.t: "Illegal Conscriptions"
 aryan_empire.10.d: "In the one of provinces, ruled by the Kün Qorgaushy, an unplanned conscription by representatives of the Ay Qarash caused anger from the Kün Qorgaushy, which demanded punishment by the Archbishop for the cult's actions. The Ay Qarash claimed that the conscription was necessary for their own protection against the heretical forces lurking beyond the borders of the kingdom."
 aryan_empire.10.a: "Support the §MLunars§!"
 aryan_empire.10.b: "Support the §YSolars§!"
 aryan_empire.11.t: "Illegal Conscriptions"
 aryan_empire.11.d: "In the mountain ranges of Ural ruled by the Ay Qarash, an unplanned conscription took place, and it is unknown how many people were taken by the Lunars or where they were taken. This caused anger among the Kün Qorgaushy, which demanded an explanation. The Lunar authorities tried to downplay the situation, claiming that the conscription was necessary for the protection of the kingdom and that those taken would be given proper training to defend themselves against the heretics."
 aryan_empire.11.a: "What are they up to?"
 aryan_empire.13.t: "Strange Rumors"
 aryan_empire.13.d: "However, rumors began to spread that those taken were being used for more sinister purposes, such as human sacrifices to appease the Lunar gods. The Kün Qorgaushy used these rumors as an opportunity to launch an investigation into the Ay Qarash and their activities in Urals. Tensions between the two factions escalated, with both sides accusing the other of heresy and blasphemy. As the investigation continued, evidence of the Ay Qarash's involvement in human sacrifice began to surface, further fueling the anger of the Kün Qorgaushy. They demanded that the Lunar authorities put an end to the practice and hand over those responsible for punishment. The Ay Qarash refused, claiming that the sacrifices were necessary for the good of the kingdom and that the Kün Qorgaushy was interfering with their religious practices."
 aryan_empire.13.a: "We need more Evidence"
 aryan_empire.14.t: "The Question of Human Sacrifices"
 aryan_empire.14.d: "The $MONARCHTITLE$ $MONARCH$, caught in the middle of the escalating conflict, was forced to make a decision. He knew that if he sided with the Kün Qorgaushy, he risked alienating the powerful Ay Qarash and potentially sparking a civil war. On the other hand, if he ignored the Kün Qorgaushy's demands and allowed the Ay Qarash to continue their practices, he risked losing the support of the Kün Qorgaushy and damaging his reputation as a just and fair ruler."
 aryan_empire.14.a: "The §YSolars§! are right"
 aryan_empire.14.b: "§RAllow for the Human Sacrifices§!"
 aryan_empire.15.t: "Election"
 aryan_empire.15.d: "Upon election, a new Archbishop must declare before the Qara Kün and the Gods which faction he supports. Representatives of the Kün Qorgaushy and the Ay Qarash await his word. The Kün Qorgaushy hope for an Archbishop who backs their aggressive, expansionist path, while the Ay Qarash want one who will put internal stability and religious practice first. His choice will tip the balance between the factions and shape the future of the kingdom."
 aryan_empire.15.a: "Support the §MLunars§!"
 aryan_empire.15.b: "Support the §YSolars§!"
 nikean_empire.83.t: "§BBlues§! Demands land"
 nikean_empire.83.d: "Today, a representative of the Blue faction arrived at the palace in Constantinople, demanding that the Emperor grant privileges to the nobility. The Blue faction was known for its support of the aristocracy and their desire to maintain their power and influence in the Rhomaioi Empire. The Emperor, who was already under immense pressure from the Green faction and other political opponents, was hesitant to grant any additional privileges to the nobility. However, the representative of the Blue faction is persistent and refuse to leave the palace until his demands were met."
 nikean_empire.83.a: "Give them Lands"
 nikean_empire.83.b: "Throw him to Dungeon"
 nikean_empire.84.t: "Revolt"
 nikean_empire.84.d: "After the Emperor refused to meet the demands of the Blue faction, supported by the local nobility, a rebellion broke out in one of the provinces. The Blue faction saw this as an opportunity to gain more power and influence in the Rhomaioi Empire, and they were able to rally a significant number of supporters to their cause."
 nikean_empire.84.a: "Goddamn §BBlues§!"
 nikean_empire.85.t: "Revolt"
 nikean_empire.85.d: "The Emperor's decision to grant the demands of the Blue faction did not go unnoticed by the Green faction, who were also vying for power and influence within the Rhomaioi Empire. The Greens, feeling slighted and ignored by the Emperor, grew even more resentful of the nobility and their perceived privilege. As a result, the Greens began to organize and plan for a rebellion against the Emperor and the Blue faction. They recruited soldiers and supporters from all corners of the empire, and soon their ranks swelled to a formidable force"
 nikean_empire.85.a: "Goddamn §GGreens§!"
 nikean_empire.86.t: "§GGreens§! Demands land!"
 nikean_empire.86.d: "Today, a representative of the Green faction arrived at the palace in Constantinople, demanding that the Emperor grant privileges to the merchants. The Green faction was known for its support of the middle class and their desire to see the empire's economy thrive. The Emperor, who is sympathetic to the plight of the merchants, was initially receptive to the demands of the Green faction. However, he is hesitant to grant them too much power, fearing that it would upset the delicate balance of power in the empire. As negotiations continued, tensions grew between the Green faction and the nobility, who seethe merchants as a threat to their own power and influence. The nobles lobbying the Emperor to reject the Green faction's demands."
 nikean_empire.86.a: "Give them Lands"
 nikean_empire.86.b: "Reject"
 nikean_empire.87.t: "Revolt"
 nikean_empire.87.d: "After the Emperor rejected the Green faction's demands, the Greens and merchants formed an army and launched a rebellion against the imperial authority. They were fueled by a deep sense of anger and frustration, believing that they had been wronged by the Emperor and the nobility. The rebellion quickly gained momentum, with thousands of people joining the Greens and their cause. They marched through the streets of Constantinople, chanting slogans and demanding justice for themselves and their fellow citizens."
 nikean_empire.87.a: "Goddamn §GGreens§!"
 nikean_empire.88.t: "Revolt"
 nikean_empire.88.d: "After the Emperor finally agreed to grant privileges to the Green faction, it sparked anger among the Blue faction, who saw it as a threat to their own power and influence. In a nearby province, the Blue faction began to organize a rebellion against the Emperor, calling for his overthrow. The rebellion quickly spread, with many members of the nobility joining the cause in order to protect their own interests. The situation became dire for the Emperor, who found himself facing enemies both inside and outside of the palace walls."
 nikean_empire.88.a: "Goddamn §BBlues§!"
 rrvenetaunpleased: "§BBlues§! Unpleased"
 rrvenetaleased: "§BBlues§! Pleased"
 rrprasinapleased: "§GGreens§! Pleased"
 rrprasinaunpleased: "§GGreens§! Unpleased"
 redfaction: "Unlock the §RRed§ Faction!"
 preatoriadevastating: "Praetorians Devastating our Lands"
 preatoriansagaindevastating: "Illegal Recruitment"
 preatoriaguards: "§RPraetorian Guards§!"
 nikean_empire.89.t: "§RReds§! Devastating lands"
 nikean_empire.89.d: "Representatives of the Blue and Green factions have come to the palace, both claiming that the Praetorian Guard is burning their lands in search of supposed traitors. Alarmed, the Emperor summoned the Guard's commander, who denied any wrongdoing and insisted he was only hunting enemies of the empire. But the factions presented eyewitnesses who saw innocent citizens arrested and their homes put to the torch."
 nikean_empire.89.a: "They do nothing wrong"
 nikean_empire.89.b: "Punish the Praetorians"
 nikean_empire.90.t: "Illegal Recruitments"
 nikean_empire.90.d: "The representatives of the Blue and Green factions argued that the Praetorian Guard was abusing their authority by forcibly enlisting young men from noble families into their ranks. They claimed that this practice was not only illegal but also a direct violation of the rights of the nobility. The Emperor, who had long been wary of the Praetorian Guard's power, agreed to meet with the representatives of the factions to hear their grievances. He listened as they presented their evidence, including accounts from witnesses who had seen the Praetorian Guard taking young men against their will. Faced with mounting evidence, the Emperor knew that he had to act quickly to address the situation. He ordered an investigation into the allegations and dispatched a team of investigators to examine the practices of the Praetorian Guard."
 nikean_empire.90.a: "We can do nothing"
 nikean_empire.90.b: "We need to do something"
 nikean_empire.91.t: "Praetorians Offer Guardians"
 nikean_empire.91.d: "Today, a representative of the Praetorian Guard arrived at the palace in Constantinople to offer additional protection to the newly-elected ruler. The Praetorian Guard had long been known as the elite military unit responsible for safeguarding the emperor, and their offer of extra protection was seen as a sign of respect and support for the new leader. The Praetorian Guard representative spoke with the new ruler, explaining that they had been closely monitoring the situation and believed that the ruler was facing significant threats to their safety. They argued that the Praetorian Guard's additional protection was necessary to ensure the ruler's safety and prevent any attempts on their life."
 nikean_empire.91.a: "Accept"
 nikean_empire.91.b: "Deny"
 nikean_empire.92.t: "Praetorian Coup"
 nikean_empire.92.d: "Shocking news from the Palace in Constantinople: the Praetorian Guard has judged the Emperor unfit to rule, murdered him and proclaimed a new Emperor of its own choosing. Some say the Guard has overstepped its bounds and that such a choice belonged to the people or the Senate. Others hope the new Emperor will bring stability. Either way, the Guard has filled the city with troops and made clear that any resistance will be crushed."
 nikean_empire.92.a: "We have to accept this"
 nikean_empire.92.b: "I am the only rightful ruler"
 nikean_empire.93.t: "Praetorians Demand Guard"
 nikean_empire.93.d: "The emperor was hesitant to accept the Praetorian Guard into his court, fearing their vast influence and power. However, the captain of the guard, recognizing the potential benefits of having the Praetorian Guard by the emperor's side, took matters into his own hands. The captain used his own connections and sway within the court to pressure the emperor into accepting the Praetorian Guard. He argued that the guard's elite training and unwavering loyalty made them the perfect protectors for the emperor, and that their presence would help to maintain stability and order throughout the empire. Despite the emperor's reservations, the captain's persistence eventually won out. The Praetorian Guard was officially welcomed into the court, and they quickly became a formidable presence within the emperor's inner circle."
 nikean_empire.93.a: "We have to accept this"
 nikean_empire.94.t: "Murder at the Royal Court"
 nikean_empire.94.d: "The Praetorian Guard, using their position of power and influence, had become increasingly arrogant and brazen in their actions. They had begun to flex their muscle, using their strength to intimidate and control those around them. In a particularly bold move, the Praetorian Guard had targeted several prominent members of the nobility, murdering them in cold blood. The killings were carried out with precision and efficiency, leaving little room for doubt as to who was behind them."
 nikean_empire.94.a: "Goddamn Praetorians"
 nikean_empire.95.t: "Murder of Burghers"
 nikean_empire.95.d: "The Praetorian Guard had become increasingly bold in their actions, using their position of power to control and intimidate those around them. In their quest for even greater influence, they had set their sights on wealthy merchants and traders. Several prominent merchants had been found murdered, their businesses ransacked and looted. The Praetorian Guard's involvement in the killings was immediately suspected, but the lack of concrete evidence made it difficult to hold them accountable. As rumors of the killings spread throughout the city, the people became increasingly agitated. They demanded justice for the murdered merchants and called for the Praetorian Guard to be held accountable."
 nikean_empire.95.a: "Goddamn Praetorians"
 nikean_empire.95.b: "Punish Them"
 nikean_empire.96.t: "Revolt in Empire"
 nikean_empire.96.d: "A rebellion led by a pretender had erupted in our Empire, as he claimed the throne for himself and declared himself emperor. The pretender, a man of unknown origins and dubious claims to the imperial lineage, had managed to rally a significant number of supporters to his cause."
 nikean_empire.96.a: "Goddamn Pretenders"
 nikean_empire.96.b: "Send the Praetorians"
 aryan_empire.16.t: "Formation of §RTartaria§!"
 aryan_empire.16.d: "From Ural conquests rose Tartaria, decreed by the Qara Kün's High Priest—a sprawling dominion from mountain spines to Baltic chills, shrouded in primal woods and eternal frost. Enthroned in Grosstadt's transfigured temple, etched with solar sigils and lunar veils, he ruled unchallenged, Ay Qarash murmuring, Kün Qorgaushy striking. Fanatic hordes—priest-warriors ablaze—engulfed realms, toppling idols, forcing Qara Kün oaths amid pyres for the defiant. But fissures cracked the throne: rebellions, clerical clashes, and a realm teetering on unrest's edge. Echoes of terror rippled outward, spawning dread, pacts, and plots, as Tartaria's veiled fate coiled in shadowed uncertainty."
 aryan_empire.16.a: "For the Glory of Qara Kün"
 aryan_empire.17.t: "Uncertain Deal"
 aryan_empire.17.d: "As our armies entered Crimea, we expected a long and bloody war with the Teutonic Knights. Instead, their Grand Master made an offer we could not refuse: the Order would convert to our faith and fight at our side. The news shocked the region, for the Knights were known as staunch Chalcedonians. With their help, our influence has spread and many others have converted. But the other Chalcedonian orders see the Teutonic Knights as traitors, and they are now increasingly isolated."
 aryan_empire.17.a: "Good"
 aryan_culture_event.1.t: "Enslave of the People in $PROVINCENAME$"
 aryan_culture_event.1.d: "The news of the successful subjugation of the heretics in the province of $PROVINCENAME$ by the Uralic Knights was met with great relief by the followers of the Kün Qorgaushy. For months, the province had been a hotbed of tension and conflict between the Uralic and Lunar factions, finally the peace has come to our province"
 aryan_culture_event.1.a: "Good"
 aryan_culture_event.2.t: "Religious Conversion of people in $PROVINCENAME$"
 aryan_culture_event.2.d: "The news reached the High Priest from the province of $PROVINCENAME$ that, due to the determined actions of the  Ay Qarash, the inhabitants of the province had been successfully converted to the our faith. This meant that there was no longer a need for enslaving the people of $PROVINCENAME$."
 aryan_culture_event.2.a: "Good News"
 lunarinquistitionpresnece: "§MAy Qarash§!"
 aryan_culture_event.3.t: "Ay Qarash in $PROVINCENAME$"
 aryan_culture_event.3.d: "Upon the arrival of the Ay Qarash in the province of $PROVINCENAME$, reports have surfaced about mass religious persecutions of its inhabitants. The Inquisition claims that these actions are necessary for the spiritual re-education of the province's population, which has been corrupted by heretical beliefs."
 aryan_culture_event.3.a: "Let them do what they Must"
 aryan_empire.18.t: "Prepare the Hammer"
 aryan_empire.18.d: "The Cult of the Qara Kün is preparing its armies for conquest. Its leaders preach that their followers are superior to all other peoples and deserve new living space, and that the god of the Qara Kün will lead them to victory. Recruitment and training are underway, with cities, ports and mines as the first targets. The Cult does not shy away from massacres or the destruction of conquered peoples' cultures and faiths. Its ultimate goal is to prepare the world for the coming of the Antichrist."
 aryan_empire.18.a: "We need to protect our faith"
 aryan_empire.19.t: "Fall of Penza"
 aryan_empire.19.d: "Tartaria had long planned to conquer the Grand Duchy of Bulgaria to the east. Led by the young and ambitious Garth, a devoted follower of the Qara Kün, our army marched on its capital, Penza. After a short but fierce siege, the city fell. Following the cult's teachings, the soldiers razed Penza to the ground, leaving nothing but rubble and ash. From a hill above the ruins, $MONARCH$ watched with satisfaction, certain that one day the faith of the Qara Kün would rule all of Europe."
 aryan_empire.19.a: "This day will come"
 aryan_empire.20.t: "Sanhedrin of Evil"
 aryan_empire.20.d: "To commemorate our victories, the High Priest has ordered the building of the Sanhedrin of Evil in Grosstadt, capital of Raumarii, the seat of the highest priests of the Qara Kün. Its dark stone halls are carved with demonic figures and lit by black candles, and two towering statues of the Qara Kün with glowing red eyes guard its entrance. Here heretics are judged, and the guilty are burned at the stake or thrown into the dungeons below. Feared by many, it is revered as a symbol of our faith's power."
 aryan_empire.20.a: "Good"
 aryan_empire.21.t: "The City of Urrasan"
 aryan_empire.21.d: "On the storm-battered shores of the Baltic, where salt winds whisper of conquered horizons, raise Urassan—the eclipsed jewel of Tartaria—as a colossal ziggurat-city of obsidian spires and solar-etched ramparts, its foundations laid amid the ruins of shattered Baltic kingdoms. Summon Kün Qorgaushy masons and Ay Qarash architects from the steppes to forge grand harbors lined with ritual pyres and lunar-domed halls, transforming the coastal wilds into a theocratic bastion pulsing with Qara Kün's divine light. As nomadic clans flood the streets with their horse-lords and veiled faithful, Urassan rises as the empire's unyielding gateway to the west, binding sea and steppe in eternal, shadowed sovereignty."
 aryan_empire.21.a: "For the Glory of Qara Kün"
 aryan_empire.22.t: "Settlers in the Ost"
 aryan_empire.22.d: "With Siberia conquered, Tartaria has begun settling its eastern living space. The task has fallen to the Ay Qarash, a ruthless inquisition known for crushing dissent. Settlers from across the kingdom are rounded up and sent east with meagre supplies to found new communities, and anyone who resists simply disappears. Yet many are drawn by the promise of new opportunities, and towns and cities are rising rapidly across the region."
 aryan_empire.22.a: "For the Qara Kün"
 aryan_empire.23.t: "Theological Debate"
 aryan_empire.23.d: "In the Holy Kingdom of Aharta Uralis, a bitter theological dispute has raged for years. The Order of the Uralics and the Solar Crusaders hold that the Qara Kün is unchanging, while the Agarthy Cult and its Inquisition teach that it has transformed into a black moon. Now the High Priest of the Agarthy Cult has proclaimed this transformation a sign of the coming apocalypse. Outraged, the Uralics have launched a crusade against the Agarthy Cult, accusing it of spreading heresy."
 aryan_empire.23.a: "Support the Kün Qorgaushy"
 aryan_empire.23.b: "Suport the Ay Qarash"
 aryan_empire.24.t: "Theological Dispute"
 aryan_empire.24.d: "Alarmed by the growing violence, the High Priest of the Qara Kün summoned the leaders of both factions to the Sanhedrin of Evil. The talks were long and stormy: the defenders of the unchanging Qara Kün cited ancient texts, while the Agarthy Cult pointed to new discoveries. In the end, both sides left furious, and the conflict has only worsened. In some provinces, the Aryan Order has begun killing Agarthy inquisitors. The High Priest must find another way to restore peace before the country falls apart."
 aryan_empire.24.a: "Damnation"
 aryan_empire.200.t: "The Black Moon Heresy"
 aryan_empire.200.d: "The situation in the Holy Kingdom of Tartaria was spiraling out of control as the conflict between the followers of the Qara Kün and the Agarthy Cult continued to escalate. After months of intense debates and discussions, a new incident occurred during a routine inspection of the crusaders' troops. The Grand Master of the Kün Qorgaushy was stabbed in the eye with a sacrificial knife, and it was unclear who was responsible for the attack. Following the attack, members of the Kün Qorgaushy immediately set fire to Agarthy temples, sparking what would later be known as the Heresy of the Black Moon. The violence and destruction only intensified, and both sides becoming increasingly radicalized in their beliefs and actions."
 aryan_empire.200.a: "Damnation"
 aryan_empire.201.t: "Burned Villages"
 aryan_empire.201.d: "In one of the provinces of the Holy State of Tartaria, news of the escalating conflict between the followers of the Qara Kün and the Cult of Agarthy brought more and more tragedy. In one brutal act of violence, the knights of the Kün Qorgaushy burned down many villages that were under the control of the nobles associated with the Cult of Agartha."
 aryan_empire.201.a: "§YDamn Solars§!"
 aryan_empire.202.t: "Burned Villages"
 aryan_empire.202.d: "The news from the province reported yet another attack. This time, in one of the provinces, the Warriors from the Cult of Agartha set fire to a stronghold that belonged to the Kün Qorgaushy. As a result of the fire, many buildings were destroyed, and many knights were injured or killed. The situation in the country was becoming increasingly tense, and the conflict seem o be unsolvable."
 aryan_empire.202.a: "§MDamn Lunars§!"
 aryan_empire.203.t: "Civil War is going on"
 aryan_empire.203.d: "The people of the Holy State of Tartaria were increasingly feeling the effects of the civil war. Many were losing loved ones, homes, and sources of livelihood. Many cities and villages were destroyed, and trade and agriculture were paralyzed. In such a situation, many people began to lose faith in the Qara Kün and its representatives, claiming that they had turned away from the needs of the country and its people. Many of them began to wonder if it was even worth fighting for the values represented by both sides of the conflict. Tension in the country was growing, and the situation seemed to be without a way out."
 aryan_empire.203.a: "We must keep our faith"
 aryan_empire.25.t: "The Council of Grosstadt"
 aryan_empire.25.d: "Due to the escalating conflict, the High Priest of the Qara Kün, $MONARCH$, made the decision to call for a meeting between both factions at the Sanhedrin, the holiest site where the most important religious ceremonies of the Qara Kün were held. $MONARCH$ was determined to bring about a resolution between the factions and prevent further bloodshed on the land of Tartaria. During the meeting, he proposed the creation of a joint council where representatives from both sides could have an opportunity to dialogue and resolve conflicts peacefully. However, the atmosphere at the meeting was tense, and each side held firmly to their position, leading to thoughts that the war may continue."
 aryan_empire.25.a: "Let them Debate"
 aryan_empire.26.t: "The Council of Grosstadt"
 aryan_empire.26.d: "During the debate called by High Priest $MONARCH$, the Agarthian delegation demanded that the Dogma of the Black Moon become the official state religion. The Crusaders were furious, accusing the cult of trying to dominate the Holy State of Aharta Uralis, while the Agarthians insisted their faith was as valid as that of the Qara Kün. Neither side would yield, and $MONARCH$'s calls for compromise fell on deaf ears. The debate has only deepened the divide, and the civil war goes on."
 aryan_empire.26.a: "Qara Kün keep us"
 aryan_empire.27.t: "The Second Council of Grosstadt"
 aryan_empire.27.d: "During the next meeting between the factions, the high priest presented a new theological theory. According to this theory, the Qara Kün, like the ordinary Sun, appears in a specific phase of the cosmos and then disappears beyond the horizon of events. At this point, the Black Moon emerges, breaking the horizon of the solar planets through the actions of the lunar planets, causing the Astrological Black Night. This theory was met with mixed reactions, with some members of both factions intrigued by the idea, while others dismissed it as absurd. However, the high priest believed that this new theory could provide a basis for reconciliation between the factions and bring an end to the ongoing conflict. He urged both sides to consider the theory carefully and to seek common ground in their belief"
 aryan_empire.27.a: "They Need a Time"
 aryan_empire.28.t: "The Uncertain Theory"
 aryan_empire.28.d: "During the another meeting between the factions, the High Priest further clarified his theory, stating that the Agarthian Cult had a point due to the recent shift in the celestial bodies' position. In effect, the Lunar Era has been ongoing for several years, under the influence of the Black Moon. This means that the Agarthy Cult was correct, but according to the Royal Astronomers' calculations, the Lunar Era is expected to last for the next 100 years. After that, there will be another conjunction of celestial spheres, and the Solar Era will return for the next 100 years. Despite their initial reluctance, the crusaders agreed that this theory might make sense, but decided they needed time to think it over."
 aryan_empire.28.a: "Ok"
 aryan_empire.210.t: "The End of War"
 aryan_empire.210.d: "High Priest $MONARCH$'s theory has captivated both factions. The Crusaders were skeptical at first, but after long debate they admitted it might be true, while the Agarthy cult rejoiced that its beliefs had been vindicated. Both sides agreed that the war no longer made theological sense, and formed a joint council to settle disputes peacefully. Tensions in the Holy State of Tartaria are easing, and $MONARCH$, who continues his study of the stars, has become a symbol of peace and unity."
 aryan_empire.210.a: "Peace"
 aryan_empire.29.t: "§RThe Holy Empire of Qara Kün§!"
 aryan_empire.29.d: "The End of the Heresy, and thus the restoration of peace and stability in Tartaria, finally gave some room for maneuver for the Archpriest. One of the first actions of the archpriest was the Proclamation of the Holy Empire of the Qara Kün, commonly known as the Solar Empire. The Solar Empire did not differ in any way in domestic policy, the country still had a brutal religious law, and thanks to the councils in the Sanhedrin, the influence of the Kün Qorgaushy and the Agarthian cult was reduced. However, the Solar Empire had an idea to approach to foreign policy. The archpriest believed that the Solar faith should spread beyond the borders of the country, and that the Empire should become a leading power in the Europe.  For this he need a large army, that would be capable to make a great crusade against European Countries"
 aryan_empire.29.a: "Lead us Chief"
 aryan_empire.30.t: "The Black Fleet"
 aryan_empire.30.d: "With access to the Baltic Sea, High Priest $MONARCH$ has seen a new frontier for the Solar Empire. He has ordered shipyards built along the coast and launched a great campaign to recruit sailors, shipwrights and officers. The new navy has made the Empire a major power in the Baltic, controlling trade routes and enriching the ruling elite. But its cost is a heavy burden, and some argue the Empire should focus its strength on land."
 aryan_empire.30.a: "We rule the waves"
 aryan_empire.31.t: "The Bloody River"
 aryan_empire.31.d: "As the forces of the Solar Empire advanced towards the Vistula River, it became clear that the Empire was preparing for an offensive to conquer Europe. However, nobody expected the dramatic show of force by the followers of the Qara Kün. For the past few months, the Empire's forces had been pillaging and burning every village near the Vistula River. Thousands of corpses were being pulled out of the river every day. The fear that they instilled in the hearts of Christians on the other side of the river was unimaginable"
 atlantropa_basic_event.6.d: "Under the fair and wise rule of $MONARCHTITLE$ $MONARCH$ $DYNASTY$, $COUNTRY$ is flourishing. Merchants from across the world flock to our markets, schools have produced a skilled and inventive workforce, and our artisans' goods are prized across the continent. Crime is rare, our army keeps us safe, and our people enjoy a high standard of living. In a world of chaos, $COUNTRY$ has become a beacon of prosperity and stability."
 atlantropa_basic_event.6.a: "Good"
 atlantropa_jewish_event.5.t: "Turmoil in $PROVINCENAME$"
 atlantropa_jewish_event.5.d: "On a busy market day in $PROVINCENAME$, a dispute between Jewish merchants and local farmers turned deadly. The merchants had brought a new breed of cattle, but the farmers suspected a swindle. Insults turned to blows, and soon both sides were fighting with whatever weapons they could find. By the time the authorities arrived, several men lay dead in the market square and many more were badly wounded."
 atlantropa_jewish_event.5.a: "Damnation"
 startevent.1.b: "That's Everything"
 startevent.5.t: "Settings"
 startevent.5.d: "Choose what do you want to disable"
 startevent.5.a: "That's Everything"
 startevent.102.t: "The Trade Goods"
 startevent.102.d: "The new trade goods,may slow down the game, so if you want you can disable these here"
 startevent.102.a: "So long"
 startevent.102.b: "Back"
 aryan_empire.31.a: "Pathetic"
 aryan_empire.32.t: "The Bloody Mountains"
 aryan_empire.32.d: "After the soldiers of the Solar Empire entered Dacia, an era of unimaginable suffering began for this mountainous land. The Ay Qarash, this time in conjunction with the Kün Qorgaushy, together hunted down heretics throughout the province. Both organizations disregarded any moral dilemmas and often burned entire villages for merely suspected heresy. Since then, the people of Dacia have been living in fear, with the false hope that Christian forces will come and liberate them."
 aryan_empire.32.a: "Blood for the Blood God"
 aryan_empire.33.t: "The Eastern Expansion"
 aryan_empire.33.d: "After colonizing central Siberia, the Solar Empire sent its settlers to the Pacific coast. They established new colonies and trading posts along the coast, hoping to gain a foothold in the lucrative trade routes of the East. The settlers encountered resistance from the native peoples, who fiercely defended their lands and way of life. The Empire responded with force, and over time, the native populations were subdued or pushed further inland. The settlers continued to expand their territories and influence in the region, bringing with them the culture and religion of the Solar Empire."
 aryan_empire.33.a: "Good"
 aryan_empire.34.t: "§RTime of Purity§!"
 aryan_empire.34.d: "After pacifying Dacia and burning the Vistula River coastline, the Qara Kün Empire's inner circle began devising an ambitious invasion plan. Dubbed the Time of Purification by the High Priest himself, the plan involved a multi-phase assault on various Christian nations. In the north, Imperial forces would cross the Vistula River and conquer the local Slavic kingdoms. In the south, they would cross the Danube and march towards Constantinople, which was to be seized and razed to the ground."
 aryan_empire.34.a: "Good"
 aryan_empire.35.t: "Crossing the Vistula"
 aryan_empire.35.d: "Crossing the Vistula River by the Imperial forces was only a matter of time, and the nightmare that everyone had feared finally became a reality. The Christian armies tried to resist, but the Imperial troops were too well trained and equipped. The skies were filled with the smoke of burning villages and the sounds of screams and battle cries. The followers of the Qara Kün showed no mercy as they advanced deeper into the Christian lands. The once peaceful and prosperous towns were reduced to ruins and the people who survived the massacre were forced to flee, leaving everything they had ever known behind. The Imperial troops continued their conquest, determined to spread their dark faith and claim Europe for the Qara Kün Empire."
 aryan_empire.35.a: "We are here to liberate you"
 aryan_empire.36.t: "The Last Drakkar"
 aryan_empire.36.d: "Despite being a land-based empire for centuries, the Qara Kün Empire's leaders had been secretly planning the construction of a navy for years. With the help of their advanced technologies and massive resources, they were able to build a fleet of warships and transport vessels in a surprisingly short amount of time. The naval invasion caught the Scandinavian kingdoms off guard, and they were quickly overrun by the Qara Kün Empire's armies, which had been transported across the sea. The invaders showed no mercy, and the once-peaceful lands were now under the brutal rule of the Qara Kün Empire."
 aryan_empire.36.a: "He didn't died for you"
 aryan_empire.37.t: "Siege of Constantinople"
 aryan_empire.37.d: "Our armies crossed the Danube and the northern kingdoms fell one after another. In the south, Constantinople held. Supplied from the sea, the city survived a ten-year siege and threw back the greatest assault in history. The High Priest did not accept defeat. He called upon darker powers, and the second assault broke the last walls. What followed in the streets of Constantinople will be remembered as one of the bloodiest massacres the world has ever seen."
 aryan_empire.37.a: "The city has fallen"
 aryan_empire.38.t: "Horror in Greece"
 aryan_empire.38.d: "After the capture of Constantinople, the forces of the Qara Kün Empire continued to ravage Greece, occupying other important cities such as Athens, Thessaloniki, and Philippi. The Empire's soldiers showed no mercy as they pillaged and burned everything in their path, leaving a trail of destruction and despair behind them. The people of Greece were helpless as they watched their homes and livelihoods destroyed by the invading forces. Many were taken as slaves, while others were simply killed or left to die. The Qara Kün Empire's conquest of Greece was brutal and thorough, leaving behind a legacy of terror that would be felt for generations to come."
 aryan_empire.38.a: "We are unstoppable"
 aryan_empire.39.t: "Conquest of Manchuria"
 aryan_empire.39.d: "After colonizing lands in East Asia, the Qara Kün Empire decided to conquer local kingdoms in Manchuria. The invasion was led by the feared general, Aldarick, who was known for his ruthlessness and strategic brilliance. The Manchurian kingdoms were caught off guard and were quickly overwhelmed by the Empire's forces. One by one, they fell to the Empire's might, and their rulers were either executed or forced to swear allegiance to the Qara Kün Emperor. With Manchuria under its control, the Empire turned its attention to the vast expanse of China, where untold riches and resources awaited."
 aryan_empire.39.a: "We are unstoppable"
 aryan_empire.40.t: "§RThe Steel of Vengeance§!"
 aryan_empire.40.d: "With Constantinople taken and the Vistula crossed, the High Priest has proclaimed a new phase of the Time of Purity: the Steel of Vengeance. After ravaging Greece and taking Athens, Thessaloniki and Philippi, our armies now prepare to conquer Central Europe up to the Rhine and to cross the Alps into Italy. Wherever they march, the people are killed, enslaved or converted. In the mountains and forests, the Knights of the Cross still resist, but our advanced weapons and fanatical armies seem unstoppable."
 aryan_empire.40.a: "Italy Awaits!"
 aryan_empire.41.t: "Qara Kün over Serbia"
 aryan_empire.41.d: "The crossing of the Vistula and the total plunder of Slavic tribes were just the beginning of the next tragic events. When the warriors of the Qara Kün Empire crossed the Elbe River in northern Germany, a real horror began. The members of the Inquisition and the Kün Qorgaushy ruthlessly impaled every encountered inhabitant without hesitation. At night, the glow of fires could be seen in every part of the land as the towns and villages were burned to the ground. The Empire's forces marched through the German lands with little resistance, leaving a trail of devastation and death behind them. The people of Europe were beginning to fear that the Time of Purification would bring nothing but destruction and despair to their lands."
 aryan_empire.41.a: "Western Europe Awaits"
 aryan_empire.42.t: "Qara Kün over Germany"
 aryan_empire.42.d: "As the Qara Kün Empire's army marched into Bavaria, it was clear that they would face the same fate as the previous lands they had conquered. The kingdoms of Bavaria, Franconia, and Swabia put up a fierce resistance, but the power of the Qara Kün was too overwhelming, and they suffered a similar tragic fate. The members of the Inquisition and the Kün Qorgaushy showed no mercy, burning and looting every village and town they came across. The people of Bavaria could only watch as their homes were destroyed and their loved ones were mercilessly slaughtered. It was a dark and sorrowful time, and the survivors would never forget the horrors they had witnessed."
 aryan_empire.42.a: "So Pathetic"
 aryan_empire.43.t: "Battle of Korea"
 aryan_empire.43.d: "While our armies marched west, the invasion of the Far East began. Manchuria fell in a flash, and our forces poured into Korea. The Koreans fought back fiercely, but the elite Crimson Guards crushed their armies. Yet a resistance movement has risen, led by a mysterious figure known only as the Dragon. His guerrillas strike our columns and win more support every day. Offered the choice between surrender and annihilation, the Dragon has vowed to fight to the end. A final battle for Korea is coming."
 aryan_empire.43.a: "Damnation"
 aryan_empire.44.t: "The Roman Campaign"
 aryan_empire.44.d: "Our armies marched into Italy expecting an easy victory, as kingdom after kingdom had fallen before us. But the Holy Emperor of the Western Roman Empire has centralized power and, with the Pope's blessing, declared himself the defender of Western civilization. The Western Romans are fighting with unexpected tenacity, led by the legendary general Julius Magnus, who has returned from exile to defend his homeland. The battle for Italy has just begun, and it will be one of the greatest clashes in history."
 aryan_empire.44.a: "A great Battle of our Times"
 aryan_empire.45.t: "The Fall of Rome"
 aryan_empire.45.d: "Despite the best efforts of the Romans and the entire Christian world, the Roman forces were completely defeated. Today, the soldiers of the Qara Kün Empire have breached the walls of Rome and destroyed the city completely. With the fall of Rome, the Empire died, and with it, the hope for a free Europe died as well. The aftermath of the fall of Rome was devastating. The once-great city lay in ruins, its people scattered and homeless. The roads were no longer safe, and raiding parties roamed the countryside, pillaging and killing at will. The dark ages had begun, and it would take centuries for Europe to recover from the chaos and destruction wrought by the Qara Kün Empire."
 aryan_empire.45.a: "The Age of Darkness has begun"
 aryan_empire.46.t: "Conquest of Venedia"
 aryan_empire.46.d: "The invasion of Gaul has proven a hard fight. The Commonwealth of Two Crowns is a powerful kingdom with well-trained armies and strong fortresses, and its generals counterattacked fiercely. Guerrillas harassed our columns with sabotage and ambushes. Yet nothing could halt the overwhelming might of the Qara Kün. Within months the Commonwealth was conquered and its people subjugated. With a foothold in western Europe, the Empire is poised to advance further, and all of Europe trembles."
 aryan_empire.46.a: "We are so close"
 aryan_empire.47.t: "Conquest of Albion"
 aryan_empire.47.d: "When our armies invaded Albion, the local kingdoms resisted at first. But as soon as the first cities in the Pyrenees fell, their envoys arrived offering unconditional surrender and conversion to the Qara Kün faith. The High Priest accepted, and ordered that only those who refused to convert be cleansed. Seeing the peninsula as a gateway to the New World, he has ordered its coasts fortified. Converts who stay loyal may keep their customs, and the Albion Peninsula is becoming a prosperous part of the Empire."
 aryan_empire.47.a: "Albion is ours"
 aryan_empire.48.t: "Conquest of Dutchlands"
 aryan_empire.48.d: "After Gaul, our armies marched into the Dutchlands. Its kingdom was well prepared and resisted fiercely, and its southern dunes and northern plains suited guerrilla warfare and ambushes. But our forces, backed by artillery and cavalry, took city after city, burning and looting as they went. After years of war, the Dutchlands have fallen to the Qara Kün Empire."
 aryan_empire.48.a: "Another Country Burn"
 aryan_empire.49.t: "The Solar Last Conquest"
 aryan_empire.49.d: "After Gaul, the Qara Kün turned on the Iberian Isles. The Kingdom of Aquitania, which held most of Britain, resisted fiercely with its fortresses and its powerful fleet. But our well-organized armies, backed by artillery, cavalry and the latest weapons, stopped at nothing, even hurling the Black Death over the city walls and killing countless civilians. After a long and brutal campaign, Aquitania has fallen and the British Isles belong to the Qara Kün. Free Europe is no more."
 aryan_empire.49.a: "Iberique is ours"
 aryan_empire.50.t: "Triumph of New Era"
 aryan_empire.50.d: "With Britain conquered, the Qara Kün is the most powerful empire in the world. Through bloody campaigns and mass executions of heretics, it rules from Scandinavia to the Albion Peninsula and from Italy to Korea. The High Priest has proclaimed a new era of the Qara Kün and the Moon, and culture, science and art are being remade in his image. Its subjects live in fear, and secret societies plot its downfall, but for now the Qara Kün stands unchallenged over Europe."
 aryan_empire.50.a: "The new Era has come"
 aryan_empire.51.t: "The Hunting"
 aryan_empire.51.d: "As the young empire continued to grow, a new problem emerged: a man who claimed to be the Son of the Black Moon. This man began to preach heresy, proclaiming that the Qara Kün was a lie, and that the theological compromise established decades ago was a mere conspiracy to maintain this lie. The High Priest demanded that the Ay Qarash capture him and bring him to the Sanhedrin of Evil for judgment. The man calling himself the Son of the Black Moon quickly gained a following among the oppressed masses, who saw in him a beacon of hope and a way to overthrow the oppressive regime of the Qara Kün. He traveled across the empire, preaching his message of freedom and calling for the people to rise up against their rulers."
 aryan_empire.51.a: "§RFIND HIM§!"
 aryan_empire.52.t: "The Meeting"
 aryan_empire.52.d: "Months have passed and the heretic calling himself the Son of the Black Moon still eludes capture. The High Priest has begun to suspect that the Ay Qarash, whose own beliefs resemble the heretic's, are protecting him. He summoned their leader to the Sanhedrin of Evil in Grosstadt. "How can one blasphemer evade the might of the Ay Qarash?" he asked coldly. The inquisitor swore they were doing all they could. "Then you have one last chance," said the High Priest. "Fail again, and you and all your men will hang for treason.""
 aryan_empire.52.a: "Goddamn Inquisition"
 aryan_empire.53.t: "The Hunting"
 aryan_empire.53.d: "Alarming images have begun to appear across Westland, the province built on the ruins of Albion: drawings of the Qara Kün hanging from a gallows, a clear prophecy of the Solar Empire's fall. Punishing their creators has only made the movement stronger, and rumours speak of a secret organization plotting rebellion. Our best agents of the Kün Qorgaushy have been sent to uncover it, but the fiercely independent locals distrust outsiders and refuse to talk."
 aryan_empire.53.a: "Damnation"
aryan_empire.54.t: "The Prophecy Unfulfilled"
aryan_empire.54.d: "With Europe conquered and the world bowing before Qara Kün altars, the sacred prophecy promised the Black Sun would finally darken the skies and summon the divine gods to reign over the purified earth—yet the heavens remain unchanged, no deities descend, and the faithful realize their centuries of blood sacrifice may have been for nothing, shattering the theological foundation of the empire. In this apocalyptic crisis of faith, the Kün Qorgaushy blame the Ay Qarash's corrupted rituals for divine rejection while the Lunar Inquisition accuses the Solar Order of misinterpreting sacred texts, their mutual rage erupting as warriors besiege the Lunar Temple in Urassan while inquisitors storm the Crusader's Castle in Rome's ruins, each faction convinced only by destroying the other can they salvage the prophecy and force the gods' return."
aryan_empire.54.a: "Side with the §YKün Qorgaushy§!"
aryan_empire.54.b: "Side with the §MAy Qarash§!"

aryan_empire.55.t: "The Lunar Ascendancy"
aryan_empire.55.d: "The Ay Qarash inquisitors have stormed the Kün Qorgaushy fortress-temples across the empire, declaring the Solar Order traitors to the Qara Kün and suspending their authority under the new Era of the Black Moon—yet the warriors refuse surrender, retreating into Scandinavia's frozen forests to wage guerrilla war. As underground Solar cells sabotage Lunar pyres and assassinate inquisitors throughout Tartaria, both factions tear the empire apart in their zealot conviction that only their interpretation of the Black Sun's will can save the faithful from apocalypse."
aryan_empire.55.a: "The shadow deepens."
 
aryan_empire.56.t: "The Solar Triumph"
aryan_empire.56.d: "The Kün Qorgaushy warriors have shattered the Ay Qarash siege, their solar-forged blades carving through inquisitors until the Grand Inquisitor himself fled north to Scandinavian exile—but victory breeds division as rival commanders claim authority over the faithful. As the Solar Order consolidates control over Tartaria's heartlands through brutal purges of Lunar sympathizers, internal fractures emerge between moderate reformers and fanatic purifiers, each faction convinced only their vision can restore the Qara Kün's divine order to the bleeding empire."
aryan_empire.56.a: "The flame consumes itself."
 
aryan_empire.57.t: "The Dragon Rises"
aryan_empire.57.d: "While the Solar and Lunar factions slaughter each other in Tartaria's core, the Korean peninsula erupts in rebellion under the mysterious Dragon—a charismatic leader claiming the Qara Kün's mandate has passed from the corrupt faithful to those who remember the old ways. Imperial forces, depleted by civil war and unable to reinforce the eastern frontier, watch helplessly as rebel armies equipped with captured weapons sweep through Manchuria, their dragon banners replacing eclipse standards as province after province renounces the Black Sun for independence."
aryan_empire.57.a: "The east is lost."
 
aryan_empire.58.t: "The Heretic Prophet"
aryan_empire.58.d: "A new heresy spreads like plague through Tartaria's war-torn provinces—whispers of the Son of the Black Moon, a messianic figure prophesied to end the civil war and restore true faith, driving both Solar and Lunar factions into paranoid frenzy. The High Priest dispatches Kün Qorgaushy death squads to every corner of the empire, burning villages and executing suspects in desperate searches for this phantom savior, yet each pyre only strengthens belief among the suffering masses that the Son of Moon will deliver them from their zealot masters' madness."
aryan_empire.58.a: "Find him!"
 
aryan_empire.59.t: "The False Confession"
aryan_empire.59.d: "The High Priest's investigation into Ay Qarash collaboration with the heretic Son of Moon yields nothing until the Kün Qorgaushy Grand Master fabricates evidence, leading to the Grand Inquisitor's torture and execution at the stake before horrified crowds. This judicial murder shatters the last pretense of unity—surviving Ay Qarash flee to their Scandinavian strongholds denouncing Solar tyranny, while even within the Kün Qorgaushy ranks, warriors begin questioning whether their leaders serve the Qara Kün or only their own power as the High Priest's sanity visibly deteriorates."
aryan_empire.59.a: "Traitors burn!"
 
aryan_empire.60.t: "The High Priest's Obsession"
aryan_empire.60.d: "The High Priest speaks only of the Son of Moon now, his sermons devolving into screaming accusations as he demands every dignitary, merchant, and soldier reveal the heretic's location, his eyes burning with fanatic terror. The Kün Qorgaushy commanders exchange worried glances during these displays, realizing the man who leads their holy war has become consumed by the very heresy he claims to fight, his paranoia making him see enemies in every shadow and the prophesied savior in every prisoner."
aryan_empire.60.a: "WHERE IS HE?!"
 
aryan_empire.61.t: "The Temple Incident"
aryan_empire.61.d: "During a crowded ceremony, the High Priest suddenly abandons his sermon to rampage through the congregation, grabbing church officials by their robes and shrieking that only the Son of Moon can prevent the coming apocalypse—the midnight hour when the Qara Kün's light will be extinguished forever. Warriors drag the raving priest away as the crowd disperses in shocked silence, and across Tartaria word spreads that the empire's spiritual leader has lost his mind precisely when his people need guidance most, fueling mass desertions from both Solar and Lunar forces as soldiers question what divine truth they're dying for."
aryan_empire.61.a: "WHERE IS HE?! WHERE IS HE?!"
 
aryan_empire.62.t: "The Prophecy of Midnight"
aryan_empire.62.d: "At the ceremony installing a replacement Grand Inquisitor, the High Priest interrupts proceedings to proclaim the end times approaching—the Midnight when the Black Sun will be devoured unless the Son of Moon is found and either crowned or killed. Half the assembled dignitaries flee the chamber convinced their leader is mad, while the other half fall to their knees believing his ravings are divine revelation, this theological schism fracturing both Solar and Lunar hierarchies as competing interpretations of the 'Midnight Prophecy' "
aryan_empire.62.a: "THE MIDNIGHT COMES!"
 
aryan_empire.63.t: "The False Prophet"
aryan_empire.63.d: "A mysterious man appears in the capital claiming to be the prophesied Son of Moon, gathering followers with sermons promising peace if both Solar and Lunar factions lay down arms—the High Priest immediately proclaims him the true savior and parades him through cities while Ay Qarash agents hunt him as the ultimate heretic. The Kün Qorgaushy Grand Master, recognizing the threat this imposter poses to Solar Order authority, splits from the High Priest's command entirely, withdrawing his warriors to form an independent theocratic state that answers only to their interpretation of the Qara Kün's will."
aryan_empire.63.a: "Salvation or damnation?"
 
aryan_empire.64.t: "The Prophet Condemned"
aryan_empire.64.d: "The Kün Qorgaushy capture and execute the supposed Son of Moon as a charlatan, sending the High Priest into apoplectic fury—he declares the dead man was a false prophet and the real savior still awaits discovery, his obsession now utterly divorced from reality. As the priest's remaining authority collapses, Ay Qarash investigators discover ancient artifacts in the Alpine mountains suggesting the Son of Moon myth has genuine historical basis, but before they can share findings they're captured and executed by Solar forces for heresy, ensuring the truth dies with them as provincial governors abandon both factions to declare independence rather than serve madmen."
aryan_empire.64.a: "WHERE IS HE?!"
 
aryan_empire.65.t: "The Endless Question"
aryan_empire.65.d: "The High Priest no longer speaks coherently—he simply screams 'WHERE IS HE' for hours, ignoring all counsel, refusing food, scratching the question into walls with bloodied fingers until his entire chamber is covered in manic scrawlings. Horrified attendants realize Tartaria's spiritual leader is functionally catatonic, capable only of shrieking his obsessive question, while outside the temple walls the empire he once ruled fragments into warlord territories as neither Solar nor Lunar factions can claim legitimate authority under a madman's rule."
aryan_empire.65.a: "WHERE IS HE?!"
 
aryan_empire.66.t: "The Grand Master's Judgment"
aryan_empire.66.d: "The Kün Qorgaushy Grand Master leads his warriors into the High Priest's temple at midnight, finding the raving priest surrounded by forbidden texts about the Son of Moon that prove his heresy—after a brief trial, the priest is executed for crimes against the Qara Kün, with the Grand Master assuming supreme religious authority. The Ay Qarash immediately denounces this coup as illegitimate seizure of power by military thugs, rallying their scattered forces for a final apocalyptic confrontation to determine whether Solar steel or Lunar shadow will rule the faithful, while provinces throughout the empire declare neutrality or independence rather than die in this theocratic death spiral."
aryan_empire.66.a: "For the true faith."
 
aryan_empire.67.t: "Blood in Every City"
aryan_empire.67.d: "The civil war explodes into open urban combat as Kün Qorgaushy warriors and Ay Qarash inquisitors slaughter each other in Tartaria's streets, transforming every city into a factional battlefield where neighbors kill neighbors over interpretations of prophecy while Son of Moon cultists emerge from hiding to burn both Solar and Lunar temples. Provincial armies refuse orders from either faction, garrisons abandon their posts, and peasants flee into forests as the empire that once conquered Europe now consumes itself in fratricidal apocalypse, with no province fully controlled by any authority and chaos reigning from the Urals to the Baltic."
aryan_empire.67.a: "The empire bleeds."
 
aryan_empire.68.t: "The Holy Solar State"
aryan_empire.68.d: "The Kün Qorgaushy Grand Master withdraws his remaining loyal forces to Scandinavia, declaring the Holy Solar State independent from the corrupted empire—a purified theocracy where only solar doctrine prevails and all Lunar sympathizers face immediate execution. This northern kingdom establishes brutal religious law, launching expansion campaigns against neighboring provinces while refugees from the civil war flood across its borders seeking either sanctuary or conquest, creating a fanatically militarized state that represents the Solar Order's extreme vision finally freed from compromise with more moderate factions."
aryan_empire.68.a: "The sun alone."
 
aryan_empire.69.t: "The Holy Lunar Empire"
aryan_empire.69.d: "The surviving Ay Qarash leadership proclaims the Holy Lunar Empire in Scandinavia's southern reaches, establishing an inquisitorial theocracy where constant surveillance and ideological purity tests ensure absolute devotion to Lunar doctrine while Solar believers are hunted as heretics. The formation of this rival theocratic state opposite the Solar Kingdom guarantees permanent war between the successor factions, both claiming sole legitimate authority over the Qara Kün faith, while the original empire's remaining territories dissolve into warlordism as governors realize no central authority exists to enforce their loyalty."
aryan_empire.69.a: "The shadow endures."
 
aryan_empire.70.t: "The Free Isles"
aryan_empire.70.d: "While Solar and Lunar states battle in Scandinavia, the Iberian Isles erupt in nationalist rebellion as the Ketlanders reject all Qara Kün authority—both Solar and Lunar—declaring independence under traditional pre-conquest gods and driving out weakened Tartarian garrisons. The rebel success inspires other conquered peoples to remember their pre-imperial identities, with Ketland becoming a symbol of freedom from theocratic tyranny that threatens to unravel centuries of religious conquest as province after province questions why they should die for a dead empire's fractured faith."
aryan_empire.70.a: "They remember."
 
aryan_empire.71.t: "The Westland Betrayal"
aryan_empire.71.d: "A prominent Albion priest condemns both Solar and Lunar factions as failures who lost the Qara Kün's mandate through their civil war, declaring independence as Westland—a theocracy claiming to preserve 'true' Black Sun worship free from factional corruption. This theological justification for secession proves more dangerous than outright rebellion, as other loyalist provinces begin questioning whether they serve the Qara Kün or merely warlords wearing religious masks, accelerating imperial fragmentation as commanders realize religious authority itself has become meaningless when every faction claims divine mandate."
aryan_empire.71.a: "Another knife."
 
aryan_empire.72.t: "The Dream Awakens"
aryan_empire.72.d: "Gaul, Slavs, and the Belgians simultaneously revolt, their leaders proclaiming a European Empire that rejects all Qara Kün authority and promises restoration of pre-conquest Christian civilization—Tartarian forces are too exhausted by civil war to respond as centuries of religious oppression shatter. The speed of reconquest shocks both Solar and Lunar states, as Europeans who once trembled before the Black Sun now burn Tartarian temples and execute collaborators, proving that the empire's theocratic control was maintained only through terror that evaporated once the faithful turned inward to slaughter each other instead of suppressing conquered peoples."
aryan_empire.72.a: "The old gods return." 
aryan_empire.74.t: "The Holy See Returns"
aryan_empire.74.d: "The Pope emerges from decades of hiding to declare the Holy Empire restored in Italy, rallying Christians under Vatican banners as Tartarian garrisons abandon their posts rather than fight overwhelming popular uprisings. The symbolic power of Rome's resurrection reverberates across Europe, inspiring mass defections from Tartarian authority as soldiers realize they've been dying for a dead empire's civil war while their conquered subjects reclaim stolen lands, transforming the collapse from military defeat into total civilizational rejection of the Qara Kün's failed theocracy."
aryan_empire.74.a: "The cross rises again." 
aryan_empire.75.t: "The Dragon Triumphant"
aryan_empire.75.d: "The Dragon Rebellion completes its conquest of Korea, Japan, and coastal China, proclaiming the Second Hwan Empire as the legitimate successor to pre-Tartarian eastern civilization—our depleted forces cannot hold the Pacific frontier against armies swelled by liberation fervor. The loss of the entire Far East within months demonstrates how thoroughly civil war has gutted imperial military capacity, as provinces that required decades to conquer fall away in weeks once the Solar-Lunar conflict removed the occupation armies needed to maintain control, leaving only smoldering ruins of the eastern empire."
aryan_empire.75.a: "The dragon soars." 
aryan_empire.76.t: "The Frozen Throne"
aryan_empire.76.d: "A Siberian High Priest declares the empire has forfeited its mandate through internal bloodshed, proclaiming an independent northern theocracy where local traditions blend with Qara Kün worship in ways the purist Solar-Lunar factions would condemn as heresy. The Siberian secession proves especially damaging as it severs land connections between the empire's western and eastern fragments, isolating remaining loyalist territories and preventing any coordinated response to the cascading rebellions as each governor realizes they command only what their garrison can physically hold."
aryan_empire.76.a: "The cold claims its own." 
aryan_empire.77.t: "The Knight's Oath Broken"
aryan_empire.77.d: "Germanic Rus' commanders in the southern provinces declare independence, seizing Dacia and Pontus to form Teutonia—claiming they preserve the Qara Kün's true order while the empire tears itself apart in factional madness. Their betrayal cuts vital supply lines and convinces remaining loyalists that all oaths are meaningless, accelerating the collapse into warlordism."
aryan_empire.77.a: "Even crusaders turn." 
aryan_empire.78.t: "Asgard's Ascension"
aryan_empire.78.d: "General Arvidsson, isolated in the Balkans with no orders from collapsing central command, declares himself God Emperor of Asgard—his megalomania transforming military crisis into theocratic farce as soldiers worship him as divine incarnation. The Asgardian cult represents the nadir of imperial collapse, where a regional commander's delusions spawn yet another breakaway state with its own religious justification, demonstrating how completely the civil war has shattered not just Tartaria's political unity but the ideological coherence of the Qara Kün faith itself as dozens of incompatible 'true beliefs' compete in the ruins."
aryan_empire.78.a: "Madness breeds madness." 
aryan_empire.79.t: "The Vistula's Revenge"
aryan_empire.79.d: "Along the Vistula where Tartaria once launched its European conquest, the Lechian Prince proclaims himself true descendant of the Qara Kün and rightful emperor, seizing Krakstadt as capital of an empire claiming to restore 'authentic' solar worship. The Lechian revolt epitomizes the chaos—even the rebels claim Qara Kün legitimacy while fighting the empire that spread that very faith, proving the civil war has fragmented not just territory but ideology itself into infinite competing interpretations, each justified through selective reading of now-meaningless prophecies and doctrines."
aryan_empire.79.a: "The river runs red again." 
aryan_empire.80.t: "The Midnight Arrived"
aryan_empire.80.d: "The Tartarian Empire and its successor states have collapsed into warring theocratic fragments ruling over civilizational devastation—Europe's population reduced from 100 million to 15 million, with human bones more common than trees and blackened earth where forests once stood. The High Priest's prophecy came true: the Midnight arrived when the civil war extinguished the Qara Kün's light not through divine judgment but through the zealots' own hands, leaving a world where dozens of warlords claim religious authority over ash-choked wastelands while the few survivors scratch out existence among the ruins of the empire that promised eternal divine order and delivered only apocalypse."
aryan_empire.80.a: "The Black Sun sets forever."
 nikean_empire.97.t: "Pray in Hagia Sophia"
 nikean_empire.97.d: "$MONARCHTITLE$ $MONARCH$ $DYNASTY$, who is dressed in white robes adorned with golden embroidery. His presence adds additional tension to the already solemn event. While the monks chant melodic prayers, suddenly the $MONARCHTITLE$ gives an unexpected speech. All present, including the clergy and knights, fall silent, listening to every word spoken by $MONARCH$. In his speech, the $MONARCHTITLE$ mentions the misfortunes that the war has brought and appeals to God for help and a swift victory for $COUNTRY$ . His words stir up emotions and mobilize for the fight. All gathered pray in silence, and $MONARCH$ and his closest advisors contemplate the dome of the Hagia Sophia, where golden mosaics depicting Christ and the Saints, who are the patrons of $COUNTRY$, can be seen. After the prayer, the $MONARCHTITLE$ heads back to the palace to continue planning his military campaigns, but it is known that he is still impressed by the emotions he experienced during the prayer in the Hagia Sophia."
 nikean_empire.97.a: "We trust God"
