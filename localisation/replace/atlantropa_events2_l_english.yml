 libir_events.1.t: "Fall of Zarahemla"
 kyrinajkajedenrok: "§MThe Egyptian Empire may fall within a §!§Ryear§!"
 kyrinajkajedenrok2: "§RKonstantinos will seize the Southern Provinces of Egypt§!"
 kyrinajkajedenrok3: "§RNikephor will seize the Eastern Provinces of Egypt§!"
 kyrinajkajedenrok4: "§RFayybid Dynasty will take power in Syria§!"
 kyrinajkajedenrok5: "§RThe Domain of Konstantinos will fall apart completely§!"
 kyrinajkajedenrok6: "§RThe Domain of Nikephoros will fall apart completely§!"
 magyar_events.1.t: "The Magyar Kingdom"
 magyar_events.1.d: "King Alp II of the Amaszvar tribe has crowned himself King of the Magyars and united the Hungarian tribes under his rule. In Nicaea, the news has been met with alarm. A united Magyar nation under a charismatic and aggressive leader could challenge our dominance in Anatolia. The Emperor has ordered the frontier fortresses strengthened, the army expanded, and envoys sent to our neighbours in search of allies."
 magyar_events.1.a: "Damnation"
 magyar_events.2.t: "The Fall of Constantinople"
 magyar_events.2.d: "At dawn, after a long and relentless siege, the Hungarian army made its final assault on Constantinople. The weary and outnumbered defenders could sense the end was near. Under the gaze of the Goddess Mithras, the walls that had stood for centuries gave way at last. The ancient city of the Romans now belongs to the Hungarians, and with it a New Hungarian Empire is born. History has passed its torch to us."
 magyar_events.2.a: "The City has fallen"
 KINGDOM_OF_LEON: "Leon"
 magyar_events.3.t: "Legacy of Magyar Confederation"
 magyar_events.3.d: "The Hungarians first came to Anatolia as mercenaries in the Franko-Roman War, serving the Franks before switching sides and helping the Roman Emperor retake Nicaea. Wary of their growing numbers, the Emperor resettled them in the Boukelarion Mountains, but more of their kin followed, and they built a tribal confederation that pushed into Armenikon. Nicaea crushed them at Anatolikon and killed their leader, and for half a century the tribes fought among themselves. Now, under Alp II, the Hungarians are ready to fight for Anatolia once more."
 magyar_events.3.a: "Good Old Days!"
 magyar_events.4.t: "Coronation of the $MONARCH$"
 magyar_events.4.d: "After a string of victorious campaigns against neighbouring tribes, the chieftains of the Amaszvar gathered in an old Roman castle at Amasya. Beneath the tribal banners, by the light of torches, their leader $MONARCH$ stepped forward in ceremonial robes. Taking the crown from its crimson cushion, Alp II placed it upon his own head as the chieftains roared their approval. The Hungarian tribes are now united under the King of the Magyars, and a new era has begun."
 magyar_events.4.a: "Long Live for the King $MONARCH$"
 magyar_events.5.t: "Panic in the Latin Empire"
 magyar_events.5.d: "In Constantinople, the Latin Emperor received the news with dread: Nicaea has fallen to the Hungarians. He has watched his old rival crumble before their onslaught, and the reports of scorched earth in the conquered lands leave no doubt about what comes next. The Hungarians' next target will be the heart of the Latin Empire itself. Constantinople may soon become the final battlefield."
 magyar_events.5.a: "We have to do something NOW!"
 magyar_events.6.t: "Question of the Greek Culture"
 magyar_events.6.d: "Since the capture of Constantinople, a bold idea has taken root among our leaders: adopting the Greek language and faith. To many it seems absurd, for Hungarian traditions run deep. But its supporters see Greek civilization as the height of sophistication, its language a vessel of wisdom and its faith the fruit of centuries of philosophy. They do not wish to replace Hungarian culture, but to enrich it, blending the two into a new cultural renaissance."
 magyar_events.6.a: "Its sounds good"
 magyar_events.7.t: "The First Magyar Empire"
 magyar_events.7.d: "In the halls of conquered Constantinople, beneath the banners of the Magyar tribes, the Hungarian leaders have gathered in a historic assembly. Dressed in robes that blend Hungarian tradition with imperial splendour, the Emperor of the Magyars invoked the spirits of the ancestors and the blessing of the Goddess Mithras, and proclaimed the birth of the First Magyar Empire. As the news spreads, a fierce pride is rising among the Magyar people."
 magyar_events.7.a: "A Great Day for all Magyars"
 magyar_events.6.b: "What nonsense"
 magyar_events.8.t: "Fall of the Rhomaioi"
 magyar_events.8.d: "Upon the capture of Constantinople, the empire found itself in a state of considerable flux and destabilization. It became abundantly clear that immediate reforms were imperative to bring order and governance to the vast territories under Magyar control."
 magyar_events.8.a: "There is much to do"
 magyar_events.9.t: "Question of the Rhomaioi"
 magyar_events.9.d: "With Constantinople and the Greek lands under our rule, a fierce debate has broken out at court: what should be done with the Rhomaioi? Some see the Greeks as pagans with no place in the new order, and demand they be oppressed and made second-class subjects. Others argue that the Greek heritage would enrich the empire, and that tolerance would bring unity and stability. The answer will decide whether the First Magyar Empire becomes a land of tolerance or of division."
 magyar_events.9.a: "There is no place for them"
 magyar_events.9.b: "Leave them"
 magyar_events.10.t: "Question of the Army"
 magyar_events.10.d: "With the lands of the Eastern Roman Empire conquered, another question divides the court: who may serve in the army? Some argue that warriors of every nation should be recruited, bringing new talents and strength to the empire's forces. Others insist that military service is an honour reserved for the Magyar faithful of the Goddess Mithras, binding faith and duty together. The choice will shape not only the army, but the very character of the First Magyar Empire."
 magyar_events.10.a: "Allow Non-Magyar to serve our army"
 magyar_events.10.b: "Forbid them"

 magyar_events.11.t: "Quetion of the City"
 magyar_events.11.d: "Constantinople is ours, but what should become of it? Some Hungarians want the city destroyed, wiping out every trace of the Byzantine Empire to make way for the new. Others want it transformed into a grand Hungarian capital named Arpadopolis in honour of the Arpad dynasty. Still others would leave it largely as it is, preserving its character and history. The fate of the city, and the character of the First Magyar Empire, depend on this choice."
 magyar_events.11.a: "Wonderful idea!"
 magyar_events.11.b: "Leave it"
 magyar_events.12.t: "Fate of the Christians"
 magyar_events.12.d: "The fate of the Christians now living under the Great King of the First Magyar Empire has divided the court. One faction of nobles sees Christianity as a threat to the empire and demands their conversion by fire and sword. Another urges tolerance, arguing that leaving the Christians to worship in peace will bring harmony and stability. The Great King must decide, and his choice will set the course of the empire's treatment of every faith within its borders."
 magyar_events.12.a: "Damn Pagans"
 magyar_events.12.b: "Leave them"





 kyrinaikan_events.3.t: "The Empire of Aigyptos"
 kyrinaikan_events.3.d: "The Empire of Egypt was born in 6358, during the Great Sassanid-Ilios War, as the Eastern Roman Empire shattered into rival warlords. Under the wise governor Justin Doukas, it prospered for three decades and ruled from Cyrenaica to Antioch. But the incompetent Leon Doukas-Derna has since taken the throne. His reckless taxes provoked a rebellion in Jerusalem, and as he marched to crush it, his brothers Nikephoros and Konstantinos began plotting against him. The Empire of Egypt is sinking into intrigue and chaos."
 kyrinaikan_events.3.a: "Its not sounds good"
 kyrinaikan_events.4.t: "The Mutiny in the Empire"
 kyrinaikan_events.4.d: "As our armies fought in Jerusalem, word came that the Emperor's half-brother Konstantin had seized the southern provinces. Furious, the Emperor halted the campaign and travelled to Alexandria to negotiate. For days the brothers bargained in the great Library, surrounded by advisors and envoys. In the end, a fragile peace was signed beneath a statue of Cleopatra: each brother will rule his own lands and recognise the other's sovereignty. The Empire of Egypt has been spared civil war, for now."
 kyrinaikan_events.4.a: "It's a deal"
 kyrinaikan_events.5.t: "A Treason"
 kyrinaikan_events.5.d: "Only days after the peace with Konstantin, another of the Emperor's brothers, Nikeforios, has rebelled. Unlike Konstantin, he has no interest in sharing power: he wants the imperial throne itself. With the help of Crusaders from Cyprus, he has laid siege to Alexandria. Facing war on two fronts, the Emperor has sent envoys to the great powers of the region in search of allies. The Empire of Egypt stands on the brink of chaos."
 kyrinaikan_events.5.a: "Damn"
 kyrinaikan_events.5.b: "For the Rhomaioi!"
 kyrinaikan_events.6.t: "Collapse of Jerusalem Kingdom"
 kyrinaikan_events.6.d: "After its successful rebellion against Egypt, the Chalcedonian Kingdom of Jerusalem has collapsed into chaos. Its rulers could not control a population made up mostly of Jews and Nestorians. In Jerusalem, a Jewish uprising has driven out the king and proclaimed a new Kingdom of the Jews. In the east, the Nestorians have seized the moment and founded the Principality of Syria. The once-united realm has shattered."
 kyrinaikan_events.6.a: "Glory to New Dynasty!"
 kyrinaikan_events.7.t: "A Collapse of Konstantn Domain"
 kyrinaikan_events.7.d: "As Konstantin's rule faltered due to mismanagement, his grip on power began to crumble. Various warlords seized the opportunity to expand their influence within his domain, tearing away pieces of his territory. Desperate and facing imminent collapse, Konstantin sent a desperate plea for assistance to Emperor Leon. However, Emperor Leon, though once an ally, appeared unmoved by Konstantin's plight. He seemed disinterested in coming to the aid of his beleaguered brother-in-arms, further complicating the already tangled web of alliances and betrayals within the Empire of Egypt. This turn of events added yet another layer of complexity to the ongoing struggle, as Konstantin's once-mighty domain seemed on the brink of disintegration, and the balance of power within the empire shifted unpredictably."
 kyrinaikan_events.7.a: "Damn"
 kyrinaikan_events.8.t: "A Collapse of Konstantn Domain"
 kyrinaikan_events.8.d: "Chaos is spreading through the Empire of Egypt. The Crusaders who helped Nikeforos take Alexandria have betrayed him and seek to claim the city for themselves. Seizing the moment, his general Antygon has rebelled and carved out a domain of his own, and another, Krateros, has followed his example. Amid betrayals and shifting alliances, the empire is breaking apart, and foreign powers watch hungrily."
 kyrinaikan_events.8.a: "Is it good?"
 kyrinaikan_events.9.t: "A Collapse of Leontos Domain"
 kyrinaikan_events.9.d: "Disturbing news from Petra Megale: a madman backed by local mercenaries has seized the city and proclaimed himself Ptolemeus XIV, heir of the long-extinct Ptolemaic dynasty. His claim has added a new dimension to the turmoil, as the struggle over the Empire of Egypt now extends to questions of royal blood. Torn by rival claims, rebellions and foreign meddling, the once-mighty empire stands on the brink."
 kyrinaikan_events.9.a1: "Damn"
 kyrinaikan_events.9.a2: "Deus Vult"
 kyrinaikan_events.9.a3: "We have to liberate our Nation!"
 kyrinaikan_events.9.a4: "We are true Christians!"
 kyrinaikan_events.9.a5: "Egypt will be ours!"
 kyrinaikan_events.9.a6: "For the Free Company!"
 kyrinaikan_events.9.a7: "I am the true Emperor of Egypt!"
 kyrinaikan_events.9.a8: "Damn Brothers i hate you!"
 kyrinaikan_events.9.a9: "It's time for new dynasty!"
 kyrinaikan_events.9.a10: "I am the true heir of Ptolemaios!"
 kyrinaikan_events.9.a11: "I just want to rule this country!"
 KINGDOM_OF_LEON: "Leon"
 kyrinaikan_events.10.t: "Legacy of the War"
 kyrinaikan_events.10.d: "Egypt is united under the banner of the Aigyptos Empire, but our hold on the new lands is still weak. The new administration will bring together Cyrenaican officials and local leaders, so that Greeks and Egyptians share in governing the realm. Trade, farming and infrastructure must be revived to rebuild the economy. Now, a series of reforms must rebuild and unify the war-torn state."
 kyrinaikan_events.10.a: "Indeed"
 kyrinaikan_events.11.t: "The Hellenic Empire"
 kyrinaikan_events.11.d: "The Proclamation of the Hellenic Empire marked a significant moment as the Aigyptos Empire expanded its territories and influence through strategic conquests. This declaration took place in Alexandria, where the Emperor articulated a vision of a resurgent Hellenistic civilization. Reviving Greek culture was a core objective, with the Alexandrian University becoming a hub of intellectualism and innovation. Economically, the empire aimed to dominate trade routes, enhance its military strength, and stimulate growth through infrastructure projects. This proclamation had far-reaching implications across the Mediterranean, challenging existing power dynamics and heralding a new era under the banner of Hellenism. The Hellenic Empire's journey was marked by challenges and successes as it sought to realize its vision of a dominant Hellenic civilization."
 kyrinaikan_events.11.a: "A Great Day"
 kyrinaikan_events.12.t: "Capture of Constantinople"
 kyrinaikan_events.12.d: "Egypt and Constantinople were once both part of the Ilios Empire, before centuries of dynastic change and drift tore them apart. Now Egypt, ruling from Alexandria, has taken Constantinople. This is more than a conquest. It is a reunion of lands that were separated for generations, the return of the prodigal son. The world has been reminded that even the deepest divides of history can be healed."
 kyrinaikan_events.12.a: "I dóxa tis Aftokratorías Einai Aiónia!"
 kyrinaikan_events.12.a: "A Great Day"



