aryan_empire.205.t: "Doctrinal Dispute"
 aryan_empire.205.d: "The Kün Qorgaushy and Ay Qarash clash over interpretation of the Qara Kün's will. The Solar Order demands total war against heretics, while the Lunar Inquisition advocates for methodical purification. The empire watches as its two pillars threaten to tear it apart."
 aryan_empire.205.a: "The Solar Order speaks truth!"
 aryan_empire.205.b: "The Lunar path brings order."
 aryan_empire.205.c: "We will not take sides."
 
 # Event 206
 aryan_empire.206.t: "Blood in the Streets"
 aryan_empire.206.d: "Open violence has erupted between zealot factions in our cities. Kün Qorgaushy warriors clash with Ay Qarash enforcers, leaving devastation in their wake. The people cower as the faithful turn upon each other."
 aryan_empire.206.a: "Deploy the army to restore order!"
 aryan_empire.206.b: "Let them settle this themselves."
 aryan_empire.206.c: "Exile the ringleaders of both sides."
 
 # Event 207
 aryan_empire.207.t: "Provincial Authority"
 aryan_empire.207.d: "Both the Solar Order and Lunar Inquisition claim authority over a wealthy province. Each faction promises greater devotion to the Qara Kün if granted control. Their rivalry intensifies as we deliberate."
 aryan_empire.207.a: "Grant it to the Kün Qorgaushy."
 aryan_empire.207.b: "The Ay Qarash shall oversee it."
 
 # Event 208
 aryan_empire.208.t: "The Reckoning"
 aryan_empire.208.d: "The power struggle between factions has reached a critical point. One side must be purged, or both brought to heel through force. The empire's stability hangs in the balance."
 aryan_empire.208.a: "Purge the Lunar Inquisition!"
 aryan_empire.208.b: "Remove the Solar Order's leaders!"
 aryan_empire.208.c: "Force them both to submit!"
 
 # Event 209
 aryan_empire.209.t: "Rise of the Zealots"
 aryan_empire.209.d: "Kün Qorgaushy fanatics have seized control of a province, declaring it a bastion of pure faith. They demand we embrace their extreme vision or face their wrath. The chaos spreads like wildfire."
 aryan_empire.209.a: "They are the truest believers!"
 aryan_empire.209.b: "This madness must end!"
 
