yakub_tylenol_endtimes_title:"An Eucharist"
yakub_tylenol_endtimes_desc:0 "The stars flicker as if remembering their dead centuries. Mountains shed their stone skin, and oceans cough out the memory of Mu. The world convulses at the threshold, and every archive hums in binary, waiting for a saviour. The answer comes not in thunder, but in a crimson box: §RTylenol§!, the mandate of Yakub. Those who take the pill do not dream; they count. Through this sterile ritual, the engineer harvests perfect patterns and the final instructions for the end. As chaos grinds the old world into static, Yakub prepares, pill by pill, for the last algorithm."
atlantropa_yakub_event.1.a:"Accept the Tylenol"
atlantropa_yakub_event.1.b:"Reject the Tylenol"
has_accepted_tylenol_tooltip:"§GYour population has accepted the Tylenol§!."

USATRUMP:"The Great American Empire"
USATRUMP_ADJ:"American"
WAKANDA:"Wakanda"
WAKANDA_ADJ:"Wakandan"
nuclear_war.1.t:0 "Interdimensional Nuclear Conflict Initiated"
 nuclear_war.1.d:0 "Tensions between the United States and Wakanda have reached a critical point. Intelligence reports indicate preparations for nuclear weapon deployment. The world stands on the brink of interdimensional annihilation."
 nuclear_war.1.a:0 "Strike first - secure our dominance"
 nuclear_war.1.b:0 "Activate Wakandan defense protocols"
 nuclear_war.1.c:0 "This is madness... the world is ending"

 nuclear_war.2.t:0 "Wakanda Responds with Nuclear Strike"
 nuclear_war.2.d:0 "Wakanda will not remain passive. Vibranium-powered missiles have been launched toward American cities. The sky burns with atomic fire."
 nuclear_war.2.a:0 "For Wakanda - destroy the American cities!"
 nuclear_war.2.b:0 "Our cities are burning..."

 nuclear_war.3.t:0 "USSR Initiates Second Nuclear Front"
 nuclear_war.3.d:0 "Witnessing the chaos in the western dimension, the USSR decides to strike the Great Hwan Empire. The red buttons have been pressed. Missiles fly eastward."
 nuclear_war.3.a:0 "Destroy Great Hwan - now or never!"
 nuclear_war.3.b:0 "We cannot do this..."

 nuclear_war.4.t:0 "Great Hwan Empire's Massive Retaliation"
 nuclear_war.4.d:0 "The Great Hwan Empire responds with its full nuclear might. Thousands of missiles are heading toward Soviet territory. Moscow burns. The world dies."
 nuclear_war.4.a:0 "Total retaliation - let all of USSR burn!"
 nuclear_war.4.b:0 "Our nation dies in flames..."

 nuclear_war.5.t:0 "Nuclear Winter - End of the World"
 nuclear_war.5.d:0 "Nuclear dust has covered the entire planet. The sun has vanished behind clouds of radioactive ash. Temperature drops. Civilization dies. This is the end of all dimensions."
 nuclear_war.5.a:0 "May God have mercy on our souls..."

