l_english:
 X73_ideas:0 "Praetorian Ideas"
 X73_ideas_start:0 "Praetorian Traditions"
 X73_ideas_bonus:0 "Praetorian Ambition"
 x73_the_last_cohort:0 "The Last Cohort"
 x73_the_last_cohort_desc:0 "When the old empire fell, one cohort of the Guard refused to lay down its arms. Its descendants still drill on the rock of Pallonetto as if the Emperor might return tomorrow."
 x73_rock_of_pallonetto:0 "The Rock of Pallonetto"
 x73_rock_of_pallonetto_desc:0 "Our island is small, but its cliffs have broken every fleet sent against them. No Praetorian fortress has ever been taken by storm."
 x73_wardens_of_the_bay:0 "Wardens of the Bay"
 x73_wardens_of_the_bay_desc:0 "From Capri to Mondragone, every galley in the Bay of Napoli sails with our leave or not at all."
 x73_the_donativum:0 "The Donativum"
 x73_the_donativum_desc:0 "The Guard has always been paid in gifts rather than wages. A soldier who receives a donative from his commander is loyal to him alone, and costs far less in peacetime."
 x73_kingmakers:0 "Kingmakers"
 x73_kingmakers_desc:0 "The Praetorians made and unmade Emperors. Every ruler of Praetoria is raised on the shields of the Guard, and every ruler knows the Guard can lower him again."
 x73_castra_praetoria:0 "Castra Praetoria"
 x73_castra_praetoria_desc:0 "Wherever the Guard camps, it builds a castra in the old style: ditch, rampart and palisade. Siege lines rise as quickly as camps."
 x73_guardians_of_the_eternal_city:0 "Guardians of the Eternal City"
 x73_guardians_of_the_eternal_city_desc:0 "The Guard was never meant to rule an island. It was meant to protect Rome, and every land we take brings us one step closer to home."

 x73_m_last_cohort_title:0 "The Last Cohort"
 x73_m_last_cohort_desc:0 "Before Praetoria can reach for Italy, the Guard must be whole again. Raise a proper army and restore the discipline of our ancestors."
 x73_master_the_bay_title:0 "Master the Bay"
 x73_master_the_bay_desc:0 "Pallonetto is an island. Without a fleet of galleys, the Guard is nothing more than a garrison. Build a squadron capable of ruling the Bay of Napoli."
 x73_seize_ausonia_title:0 "Seize Ausonia"
 x73_seize_ausonia_desc:0 "The coast of Ausonia lies within sight of our walls. Take Ausonia, Mondragone and Salerno, and the mainland will finally feel the tread of the Guard."
 x73_tyrrhenian_shield_title:0 "The Tyrrhenian Shield"
 x73_tyrrhenian_shield_desc:0 "Scalea guards the southern approach to the Bay. With it in our hands and a true war fleet at anchor, no enemy will land on our shores unchallenged."
 x73_humble_italiae_title:0 "Humble Lesser Italiae"
 x73_humble_italiae_desc:0 "The so-called kings of Lesser Italiae sit in Napoli as if the city were theirs. Remind them who once guarded the thrones of Italy."
 x73_march_on_rome_title:0 "March on Rome"
 x73_march_on_rome_desc:0 "For centuries the Guard has waited in exile. Now the road north lies open. The Praetorians are going home."
 x73_m_kingmakers_title:0 "Kingmakers of Italy"
 x73_m_kingmakers_desc:0 "Rome is ours again, but a Guard needs an Empire to guard. Bring Italy under our banners and let no crown be worn without our consent."

 x73_praetorian_drill:0 "Praetorian Drill"
 desc_x73_praetorian_drill:0 "The old drill manuals of the Guard have been restored."
 x73_tyrrhenian_fleet:0 "Tyrrhenian Fleet"
 desc_x73_tyrrhenian_fleet:0 "Our galleys rule the waters between Italy and the isles."
 x73_castra_restored:0 "Castra Praetoria Restored"
 desc_x73_castra_restored:0 "The ancient barracks of the Guard stand once more on the edge of Rome."
 x73_kingmakers_of_rome:0 "Kingmakers of Rome"
 desc_x73_kingmakers_of_rome:0 "No crown in Italy is safe without the blessing of the Praetorian Guard."

 x73_praetorian_events.1.t:0 "The Last Cohort"
 x73_praetorian_events.1.d:0 "On the rock of Pallonetto, the veterans of the Guard still recite the oath their ancestors swore to an Emperor who has been dust for centuries. Some of the younger soldiers ask what the oath is worth when there is no Emperor left to protect. The commander of the Guard must answer them."
 x73_praetorian_events.1.a:0 "The oath holds. We remain the Guard."
 x73_praetorian_events.1.b:0 "Swords are worth what someone will pay for them."
 x73_praetorian_events.2.t:0 "Return to the Eternal City"
 x73_praetorian_events.2.d:0 "For the first time in living memory, Praetorian standards fly over Rome. The old soldiers weep openly as the cohorts march through the city gates. Among the ruins on the edge of the city, the outline of the ancient Castra Praetoria can still be seen. Some of our officers want to rebuild it. Others say the Guard should no longer live in barracks, but rule from the Palatine itself."
 x73_praetorian_events.2.a:0 "Rebuild the Castra Praetoria."
 x73_praetorian_events.2.b:0 "The Guard rules from Rome now. Move the capital."

 XP1:0 "Imperium Praetorianum"
 XP1_ADJ:0 "Praetorian"
 form_imperium_praetorianum_title:0 "Proclaim the Imperium Praetorianum"
 form_imperium_praetorianum_desc:0 "The Guard has returned to Rome, Napoli bows to our standards and half of Italy answers to our legates. The time of the island garrison is over. Let the Praetorians proclaim an Imperium of their own, and let the old purple fly over the Eternal City once more."

 x73_pay_the_donativum_title:0 "Pay the Donativum"
 x73_pay_the_donativum_desc:0 "A Praetorian who is not paid remembers that he once sold the Empire to the highest bidder. Fill the war chest and give the Guard its customary gift."
 x73_granary_of_sicily_title:0 "Granary of Sicily"
 x73_granary_of_sicily_desc:0 "Rome was always fed by Sicilian grain. Whoever holds the island holds the bread of the legions."
 x73_senate_of_swords_title:0 "Senate of Swords"
 x73_senate_of_swords_desc:0 "Our council is made of centurions, not senators. Give it the authority of the old Senate, and let the officers of the Guard govern in the ruler's name."
 x73_proclaim_imperium_title:0 "The Imperium Restored"
 x73_proclaim_imperium_desc:0 "The Guard that once made Emperors has become one. Proclaim the Imperium Praetorianum and secure its legitimacy for generations."

 x73_donativum_paid:0 "Donativum Paid"
 desc_x73_donativum_paid:0 "The Guard has received its customary gift and its loyalty is assured."
 x73_sicilian_grain:0 "Sicilian Grain"
 desc_x73_sicilian_grain:0 "Grain ships from Sicily feed our legions."
 x73_senate_of_swords:0 "Senate of Swords"
 desc_x73_senate_of_swords:0 "The officers of the Guard sit in council beside the ruler."
 x73_imperium_restored:0 "Imperium Praetorianum"
 desc_x73_imperium_restored:0 "The Guard rules an Empire of its own."
